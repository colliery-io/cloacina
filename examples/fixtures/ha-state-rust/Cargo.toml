# CLOACI-T-0851: HA window-survival fixture. Version deps ON PURPOSE — this is
# built by the IN-CLUSTER compiler, whose dev-workspace escape hatch
# (CLOACINA_COMPILER_DEV_WORKSPACE) patches crates.io versions to the baked
# source. Path deps here would bake this machine's filesystem into the archive
# and fail `cargo fetch` inside the container (the exact 13ms failure the
# k8s-leader lane hit with the host-flavored dist archives).
[package]
name = "ha-state-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

# Used by macro output, which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["cloacina-computation-graph", "cloacina-workflow", "serde_json"]

[workspace]

[features]
default = ["packaged"]
packaged = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cloacina-computation-graph = "0.11"
cloacina-macros = "0.11"
cloacina-workflow = { version = "0.11", features = ["packaged"] }
cloacina-workflow-plugin = "0.11"
serde_json = "1.0"

[build-dependencies]
cloacina-build = "0.11"
