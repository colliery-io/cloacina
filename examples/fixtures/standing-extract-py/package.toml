# Fixture of the behaviour suite's standing workload (CLOACINA-T-1107): a
# data-shaped job on a five-minute schedule. Three short tasks in a row; each
# run writes the interval it was given.
[package]
name = "standing-extract-py"
version = "0.1.0"
interface = "cloacina-workflow-plugin"
interface_version = 1
extension = "cloacina"

[metadata]
workflow_name = "standing_extract"
language = "python"
description = "standing workload: a short data job every five minutes"
author = "behaviour-suite"
entry_module = "standing_extract.tasks"
