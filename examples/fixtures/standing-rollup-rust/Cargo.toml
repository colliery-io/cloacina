# Version deps, as a team would write them. The cloacina crates are not on
# crates.io yet: the compiler of a dev stack resolves them with
# `--dev-workspace`.
[workspace]

[package]
name = "standing-rollup-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

# cloacina-macros: required by package validation (cloacina-macros + cloacina-workflow).
[package.metadata.cargo-machete]
ignored = ["cloacina-macros"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["packaged"]
packaged = []

[dependencies]
cloacina-macros = "0.12"
cloacina-workflow = { version = "0.12", features = ["packaged"] }
cloacina-workflow-plugin = "0.12"
serde_json = "1.0"

[build-dependencies]
cloacina-build = "0.12"
