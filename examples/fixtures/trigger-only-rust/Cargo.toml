[package]
name = "trigger-only-rust"
version = "0.1.0"
edition = "2021"
description = "Primitive-only fixture: triggers only, no reactor / CG / workflow"
publish = false

# Used by macro output, which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["serde_json"]

[workspace]

[features]
default = ["packaged"]
packaged = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cloacina-macros = { path = "../../../crates/cloacina-macros" }
cloacina-workflow = { path = "../../../crates/cloacina-workflow", features = ["packaged"] }
cloacina-workflow-plugin = { path = "../../../crates/cloacina-workflow-plugin" }
serde_json = "1.0"
