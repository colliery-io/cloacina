[package]
name = "mixed-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Mixed primitive fixture: reactor + trigger + reactor-bound CG + trigger-subscribing workflow"
publish = false

# Used by macro output, which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["cloacina-computation-graph"]

[workspace]

[features]
default = ["packaged"]
packaged = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cloacina-macros = { path = "../../../crates/cloacina-macros" }
cloacina-computation-graph = { path = "../../../crates/cloacina-computation-graph" }
cloacina-workflow = { path = "../../../crates/cloacina-workflow", features = ["packaged"] }
cloacina-workflow-plugin = { path = "../../../crates/cloacina-workflow-plugin" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# CLOACI-I-0128: opt into typed reactor/accumulator boundary schemas.
schemars = "0.8"
tokio = { version = "1", features = ["time"] }
