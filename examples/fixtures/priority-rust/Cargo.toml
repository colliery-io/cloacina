[package]
name = "priority-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Used by macro output, which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["cloacina-macros", "serde_json"]

[workspace]

[features]
default = ["packaged"]
packaged = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cloacina-macros = { path = "../../../crates/cloacina-macros" }
cloacina-workflow = { path = "../../../crates/cloacina-workflow", features = ["packaged"] }
cloacina-workflow-plugin = { path = "../../../crates/cloacina-workflow-plugin" }
serde_json = "1.0"
