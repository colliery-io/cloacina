[workspace]

[package]
name = "cg-feature-tour"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

# Used by macro output, which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["cloacina-computation-graph"]

[features]
default = ["packaged"]
packaged = []

[lib]
crate-type = ["cdylib", "rlib"]

# Production-shaped: crates.io version deps (what `cloacinactl package new`
# emits). Dev stacks resolve these against the local workspace via the
# compiler's `--dev-workspace` flag; production compilers use crates.io.
[dependencies]
cloacina-macros = "0.12"
cloacina-computation-graph = "0.12"
cloacina-workflow = { version = "0.12", features = ["packaged"] }
cloacina-workflow-plugin = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"

[build-dependencies]
cloacina-build = "0.12"
