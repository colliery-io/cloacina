[package]
name = "packaged-graph-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

# Used by macro output, which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["cloacina-computation-graph", "cloacina-workflow", "serde_json"]

[workspace]

[features]
default = ["packaged"]
packaged = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cloacina-computation-graph = "0.11"
cloacina-macros = "0.11"
cloacina-workflow = { version = "0.11", features = ["packaged"] }
cloacina-workflow-plugin = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# CLOACI-T-0768: typed inject/fire interface for the orderbook/pricing boundaries.
schemars = "0.8"

[build-dependencies]
cloacina-build = "0.11"
