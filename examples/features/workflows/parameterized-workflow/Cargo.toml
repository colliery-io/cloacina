[workspace]

[package]
name = "parameterized-workflow-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

# cloacina-macros: required by package validation (cloacina-macros + cloacina-workflow).
[package.metadata.cargo-machete]
ignored = ["cloacina-macros"]

[features]
default = ["packaged"]
packaged = []

[lib]
crate-type = ["cdylib", "rlib"]

# Production-shaped: crates.io version deps (what `cloacinactl package new`
# emits). Dev stacks resolve these against the local workspace via the
# compiler's `--dev-workspace` flag; production compilers use crates.io.
[dependencies]
cloacina-macros = "0.11"
cloacina-workflow = { version = "0.11", features = ["packaged"] }
cloacina-workflow-plugin = "0.11"
serde_json = "1.0"

[build-dependencies]
cloacina-build = "0.11"
