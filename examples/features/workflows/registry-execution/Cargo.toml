[package]
name = "registry-execution-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace]

[dependencies]
cloacina = { path = "../../../../crates/cloacina" }
tokio = { version = "1.35", features = ["full"] }
serde_json = "1.0"
tempfile = "3.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"

[build-dependencies]
cloacina-build = { path = "../../../../crates/cloacina-build" }
