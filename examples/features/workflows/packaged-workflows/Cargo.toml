[package]
name = "packaged-workflow-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

# cloacina-macros: required by package validation (cloacina-macros + cloacina-workflow).
[package.metadata.cargo-machete]
ignored = ["cloacina-macros"]

[workspace]

[features]
default = ["packaged"]
packaged = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cloacina-macros = "0.11"
cloacina-workflow = { version = "0.11", features = ["packaged"] }
cloacina-workflow-plugin = "0.11"
serde_json = "1.0"
# User workflow dependencies:
chrono = "0.4"
tokio = { version = "1.0", features = ["time"] }


[build-dependencies]
cloacina-build = "0.11"
