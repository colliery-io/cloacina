[package]
name = "packaged-triggers-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[features]
default = ["packaged"]
packaged = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cloacina-workflow = { version = "0.11", features = ["packaged"] }
cloacina-workflow-plugin = "0.11"
serde_json = "1.0"
chrono = "0.4"
tokio = { version = "1.0", features = ["time"] }


[build-dependencies]
cloacina-build = "0.11"
