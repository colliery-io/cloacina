[package]
name = "cron-scheduling-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

# Used by macro output, which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["cloacina-workflow"]

[workspace]

[dependencies]
# cloacina = { path = "../../../../crates/cloacina" }
cloacina = { path = "../../../../crates/cloacina" }
cloacina-workflow = { path = "../../../../crates/cloacina-workflow" }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"

[build-dependencies]
cloacina-build = { path = "../../../../crates/cloacina-build" }
