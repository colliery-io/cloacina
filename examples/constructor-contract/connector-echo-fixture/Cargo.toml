# A Sync connector fixture (COLLIERY-I-0632 / CLOACINA-T-0973): a WASM component
# that implements the `connector` interface directly, as weir's guests did, so
# the connector host can be tested without a real database. Own [workspace] so
# the parent workspace does not build this wasm-only crate natively. Built by
# the `connector_host_wasm` test to wasm32-wasip2.
[workspace]

[package]
name = "connector-echo-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[package.metadata.cargo-machete]
ignored = ["wit-bindgen", "serde"]

[lib]
crate-type = ["cdylib"]

[dependencies]
fidius-guest = "0.5.9"
fidius-macro = "0.5.9"
wit-bindgen = "0.44"
# `config = sync::Config` is the serde type the host binds at load; the typed
# method types are the local WitType copies in src/sync_guest_types.rs.
cloacina-constructor-contract = { path = "../../../crates/cloacina-constructor-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
fidius-build = "0.5.9"

[profile.release]
opt-level = "s"
lto = true
strip = true
