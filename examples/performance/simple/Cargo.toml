[package]
name = "performance-simple"
version = "0.1.0"
edition = "2021"

# Used by macro output, which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["cloacina-workflow"]

[workspace]

[dependencies]
cloacina = { path = "../../../crates/cloacina" }
cloacina-workflow = { path = "../../../crates/cloacina-workflow" }
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
futures = "0.3"

[build-dependencies]
cloacina-build = { path = "../../../crates/cloacina-build" }
