[package]
name = "data-pipeline-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Used by macro output, which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["cloacina-workflow"]

[workspace]

[dependencies]
cloacina = { path = "../../../../../crates/cloacina" }
cloacina-workflow = { path = "../../../../../crates/cloacina-workflow" }
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.2"

[build-dependencies]
cloacina-build = { path = "../../../../../crates/cloacina-build" }
