[package]
name = "tutorial-03"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Used by macro output, which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["cloacina-workflow"]

[workspace]

[dependencies]
cloacina = { path = "../../../../../crates/cloacina" }
cloacina-workflow = { path = "../../../../../crates/cloacina-workflow" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.10"

[build-dependencies]
cloacina-build = { path = "../../../../../crates/cloacina-build" }
