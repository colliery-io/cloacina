[package]
name = "tutorial-07"
version = "0.1.0"
edition = "2021"

# Used by macro output, which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["cloacina-computation-graph"]

[workspace]

[dependencies]
cloacina = { path = "../../../../../crates/cloacina" }
cloacina-computation-graph = { path = "../../../../../crates/cloacina-computation-graph" }
cloacina-macros = { path = "../../../../../crates/cloacina-macros" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tracing-subscriber = "0.3"

[build-dependencies]
cloacina-build = { path = "../../../../../crates/cloacina-build" }
