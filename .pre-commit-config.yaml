---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        files: \.rs$
        args:
          - --license-filepath
          - LICENSE-HEADER.txt
          - --comment-style
          - /*| *| */
          - --use-current-year
          - --detect-license-in-X-top-lines=16

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The API reference is plissken output; regenerate it, don't hand-fix it.
      - id: trailing-whitespace
        exclude: ^docs/src/content/docs/reference/api/
      - id: end-of-file-fixer
        exclude: ^docs/src/content/docs/reference/api/
      - id: check-yaml
        # Helm templates use Go templating ({{ ... }}) so they are not
        # valid YAML standalone. helm lint covers them in CI.
        exclude: ^charts/.*/templates/.*\.yaml$
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      # - id: clippy

  - repo: local
    hooks:
      - id: cargo-check
        name: Cargo check with both backends
        entry: cargo check --features "postgres,sqlite,macros"
        language: system
        types: [rust]
        pass_filenames: false
      # CLOACINA-T-0953: no unused dependencies in any Cargo.toml (workspace,
      # ui, providers, examples). Needs `cargo install cargo-machete`. A
      # dependency only macro output uses goes in that crate's
      # [package.metadata.cargo-machete] ignored list.
      - id: cargo-machete
        name: Unused dependencies (cargo-machete)
        entry: cargo machete
        language: system
        files: (\.rs|Cargo\.toml)$
        pass_filenames: false
      # CLOACI-I-0134: single source of version truth. Fails if any core
      # version touchpoint (Rust workspace, npm, python, scaffold pin) has
      # drifted from [workspace.package] version. CI does NOT run pre-commit;
      # the server-side enforcement is the same script run directly in ci.yml
      # quick-checks (CLOACI-T-0917) — this hook is the fast local feedback.
      # `language: python` uses a pre-commit-managed
      # interpreter (stdlib-only script) so it never depends on the ambient
      # python. Providers under examples/ are independently versioned (A-0010)
      # and deliberately excluded.
      - id: version-lockstep
        name: Version lockstep (single source of truth)
        entry: python .angreal/version_lockstep.py check
        language: python
        pass_filenames: false
        always_run: true
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Check YAML files with yamllint
        entry: yamllint -c .yamllint-config.yml --strict
        types: [yaml]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: Run codespell to check for common misspellings in files
        language: python
        types: [text]
        exclude: ^docs/themes/.*$|\.js$|\.css|\.json$|^\.metis/|^ui/design/|(^|/)Cargo\.lock$
        args: [--ignore-words=.spelling_wordlist.txt]
