# The Postgres connector (COLLIERY-I-0632 / CLOACINA-T-0979): a Sync source and
# destination as one wasm32-wasip2 component. A sync wire client over
# fidius's TCP egress and postgres-protocol, no libpq, with TLS through rustls.
# Moved from weir. Own [workspace] so the parent workspace does not build this
# wasm-only crate natively; built by the tests and staged as a provider package.
[workspace]

[package]
name = "cloacina-connector-postgres"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "cloacina Sync connector for Postgres (WASM component): full-refresh, incremental-by-cursor and CDC reads; append, overwrite and upsert writes."
license = "Apache-2.0"
repository = "https://github.com/colliery-io/cloacina"
publish = false

[package.metadata.cargo-machete]
ignored = ["wit-bindgen", "serde"]

[lib]
crate-type = ["cdylib"]

[dependencies]
fidius-guest = "0.5.9"
fidius-macro = "0.5.9"
wit-bindgen = "0.44"
# `config = sync::Config` and the typed schema types are the serde contract; the
# typed method types are the local WitType copies in src/sync_guest_types.rs.
cloacina-constructor-contract = { path = "../../crates/cloacina-constructor-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postgres-protocol = "0.6"
bytes = "1"
fallible-iterator = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
rustls-pki-types = "1.11"
webpki-roots = "0.26"

[build-dependencies]
fidius-build = "0.5.9"

[profile.release]
opt-level = "s"
lto = true
strip = true
