# The Snowflake connector (COLLIERY-I-0633 / CLOACINA-T-0986): a Sync source
# and destination over the Snowflake SQL API, as a wasm32-wasip2 component.
# Requests leave the guest unauthenticated; the host's egress adds a key-pair
# JWT. Moved from weir. Own [workspace] so the parent workspace does not build
# this wasm-only crate natively; built by the tests and staged as a provider
# package.
[workspace]

[package]
name = "cloacina-connector-snowflake"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "cloacina Sync connector for Snowflake (WASM component): table or query reads, full refresh and incremental; append, overwrite, upsert and CDC writes."
license = "Apache-2.0"
repository = "https://github.com/colliery-io/cloacina"
publish = false

[package.metadata.cargo-machete]
ignored = ["wit-bindgen", "serde"]

[lib]
crate-type = ["cdylib"]

[dependencies]
fidius-guest = "0.5.9"
fidius-macro = "0.5.9"
wit-bindgen = "0.44"
# `config = sync::Config` and `cursor_cmp` are the serde contract; the typed
# method types are the local WitType copies in src/sync_guest_types.rs.
cloacina-constructor-contract = { path = "../../crates/cloacina-constructor-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
fidius-build = "0.5.9"

[profile.release]
opt-level = "s"
lto = true
strip = true
