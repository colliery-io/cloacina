[[setup]]
table = "ORDERS"
columns = ["ID", "NAME", "UPDATED_AT"]
data = [
  [1, "order 1", "2026-01-01"],
  [2, "order 2", "2026-01-02"],
  [3, "order 3", "2026-01-03"],
  [4, "order 4", "2026-01-04"],
  [5, "order 5", "2026-01-05"],
  [6, "order 6", "2026-01-06"],
  [7, "order 7", "2026-01-07"],
  [8, "order 8", "2026-01-08"],
  [9, "order 9", "2026-01-09"],
  [10, "order 10", "2026-01-10"],
  [11, "order 11", "2026-01-11"],
  [12, "order 12", "2026-01-12"],
]

[spec]
name = "snowflake"
contract_version = 1
roles = ["Source", "Destination"]
supported_sync_modes = ["FullRefresh", "Incremental"]

[[check]]
case = "good config"
success = true

[[check]]
case = "good config, destination"
side = "destination"
success = true

[[check]]
case = "a JWT from another key"
secret = "other_key"
success = false
message_contains = "401"

[[check]]
case = "no warehouse"
config_text = '{"account": "testorg-sync", "database": "SYNC_DB", "schema": "PUBLIC"}'
success = false
message_contains = "missing `warehouse`"

[discover]
streams = [{ name = "records", supported_sync_modes = ["FullRefresh", "Incremental"] }]

# The SQL API answers every value as a string.
[[read]]
case = "full refresh across partitions"
stream = { stream = "orders" }
records = [
  { id = "1", name = "order 1", updated_at = "2026-01-01" },
  { id = "2" }, { id = "3" }, { id = "4" }, { id = "5" }, { id = "6" },
  { id = "7" }, { id = "8" }, { id = "9" }, { id = "10" }, { id = "11" }, { id = "12" },
]
dead_letters = []

[[read]]
case = "incremental from the start"
stream = { stream = "orders", sync_mode = "Incremental", cursor_field = "id" }
records = [
  { id = "1" }, { id = "2" }, { id = "3" }, { id = "4" }, { id = "5" }, { id = "6" },
  { id = "7" }, { id = "8" }, { id = "9" }, { id = "10" }, { id = "11" }, { id = "12" },
]
ordered = true
checkpoints = [{ cursor = "12" }]

# A numeric cursor at "9" must still read "10".
[[read]]
case = "incremental resumes past 9"
stream = { stream = "orders", sync_mode = "Incremental", cursor_field = "id" }
state = { cursor = "9" }
records = [{ id = "10" }, { id = "11" }, { id = "12" }]
ordered = true
checkpoints = [{ cursor = "12" }]

[[read]]
case = "a configured query"
config = { query = "SELECT * FROM \"SYNC_DB\".\"PUBLIC\".\"ORDERS\"" }
stream = { stream = "orders", sync_mode = "Incremental", cursor_field = "id" }
state = { cursor = "11" }
records = [{ id = "12" }]

[[write]]
case = "append in chunks"
config = { table = "APPENDED" }
stream = { stream = "appended" }
batches = [[{ id = 1, name = "a" }, { id = 2, name = "b" }, { id = 3, name = "c" }], [{ id = 4, name = "d" }]]
accepted = 4
dead_letters = []

[[write.verify]]
rows_of = "APPENDED"
rows = [{ id = 1, name = "a" }, { id = 2, name = "b" }, { id = 3, name = "c" }, { id = 4, name = "d" }]

[[write]]
case = "upsert"
config = { table = "UPSERTED" }
stream = { stream = "upserted", write_mode = { Upsert = { business_keys = ["id"] } } }
batches = [[{ id = 1, name = "a" }, { id = 2, name = "b" }]]
accepted = 2

# Two rows per statement: both id 3 rows share one MERGE, which keeps the last.
[[write]]
case = "upsert again, a key twice in one statement"
config = { table = "UPSERTED" }
stream = { stream = "upserted", write_mode = { Upsert = { business_keys = ["id"] } } }
batches = [[{ id = 3, name = "c" }, { id = 3, name = "c2" }, { id = 2, name = "b2" }]]
accepted = 2

[[write.verify]]
rows_of = "UPSERTED"
rows = [{ id = 1, name = "a" }, { id = 2, name = "b2" }, { id = 3, name = "c2" }]

[[write]]
case = "overwrite"
config = { table = "APPENDED" }
stream = { stream = "appended", write_mode = "Overwrite" }
batches = [[{ id = 9, name = "z" }]]
accepted = 1

[[write.verify]]
rows_of = "APPENDED"
rows = [{ id = 9, name = "z" }]

[[write]]
case = "a record that is not an object"
config = { table = "APPENDED" }
stream = { stream = "appended" }
batches = [[{ id = 10, name = "y" }, "[1, 2]"]]
accepted = 1
dead_letters = [{ record = [1, 2], reason_contains = "not a JSON object" }]
