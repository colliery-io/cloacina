# Conformance file for the Snowflake connector (CLOACINA-A-0014, CLOACINA-T-0986).
# Runs against the mock SQL API in `cloacina_testing::connectors::snowflake_mock`,
# which passes ${MOCK_URL} and ${MOCK_GRANT}: `cargo test -p cloacina-sync
# --test snowflake_connector`. The mock checks the JWT the host injects, answers
# each statement 202 first, and splits results into partitions of five rows.
# Steps: `table` with `columns` and `data` loads a mock table; `rows_of`
# returns one. The format is documented in `cloacina_testing::connectors::conformance`.

connector = "snowflake"
crate = "."

[source]
config = { account = "testorg-sync", database = "SYNC_DB", schema = "PUBLIC", warehouse = "SYNC_WH", base_url = "${MOCK_URL}", table = "ORDERS" }
grants = { http = ["${MOCK_GRANT}"] }
credential = { kind = "snowflake_keypair_jwt", secret = "snowflake", account = "testorg-sync", user = "sync_test" }

[destination]
config = { account = "testorg-sync", database = "SYNC_DB", schema = "PUBLIC", warehouse = "SYNC_WH", base_url = "${MOCK_URL}", batch_rows = 2 }
grants = { http = ["${MOCK_GRANT}"] }
credential = { kind = "snowflake_keypair_jwt", secret = "snowflake", account = "testorg-sync", user = "sync_test" }

