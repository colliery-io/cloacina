{{- include "cloacina-server.validateDatabase" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloacina-server.fullname" . }}
  labels:
    {{- include "cloacina-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "cloacina-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloacina-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if eq .Values.fleet.actuator "kubernetes" }}
      # Bind the least-privilege fleet RBAC (REQ-006) so the K8s actuator can
      # provision per-tenant namespaces + agent Deployments.
      serviceAccountName: {{ include "cloacina-server.fleetServiceAccountName" . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cloacina-server
          image: {{ include "cloacina-server.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--bind"
            - {{ .Values.server.bind | quote }}
            {{- if .Values.metrics.enabled }}
            - "--metrics-bind"
            - {{ printf "0.0.0.0:%v" .Values.metrics.port | quote }}
            {{- end }}
            {{- if ne (.Values.server.logFormat | default "text") "text" }}
            - "--log-format"
            - {{ .Values.server.logFormat | quote }}
            {{- end }}
            {{- if .Values.server.taskLogUrlTemplate }}
            - "--task-log-url-template"
            - {{ .Values.server.taskLogUrlTemplate | quote }}
            {{- end }}
            - "--tenant-runner-cache-size"
            - {{ .Values.server.tenantRunnerCacheSize | quote }}
            - "--tenant-deletion-drain-timeout-s"
            - {{ .Values.server.tenantDeletionDrainTimeoutSeconds | quote }}
            {{- if .Values.server.requireSignatures }}
            - "--require-signatures"
            {{- end }}
            {{- if .Values.server.verificationOrgId }}
            - "--verification-org-id"
            - {{ .Values.server.verificationOrgId | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- if .Values.reactorAffinity.enabled }}
            # CLOACI-T-0851 / A-0012 Amendment 3: the address this replica
            # publishes when it claims a reactor, so injects landing elsewhere
            # can be steered here instead of relayed through the outbox.
            #
            # POD IP, deliberately NOT a per-pod headless DNS name. Kubernetes
            # only creates per-pod A records when the pod sets BOTH `hostname`
            # and `subdomain` — and Deployment replicas cannot each declare a
            # distinct static hostname, which is why per-pod DNS implies a
            # StatefulSet. This was tried: the published DNS name resolved
            # nowhere and every redirected inject died with a connection
            # failure. IP churn is a non-issue here because the address row is
            # REWRITTEN ON EVERY CLAIM — a rescheduled pod re-claims and
            # republishes its new IP, so a stale IP lives only as long as a
            # stale claim, which the ownership watchdog already bounds.
            - name: CLOACINA_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CLOACINA_ADVERTISED_ADDRESS
              value: "http://$(CLOACINA_POD_IP):{{ .Values.service.port }}"
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
            {{- else if .Values.databaseUrlSecretRef.name }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseUrlSecretRef.name }}
                  key: {{ .Values.databaseUrlSecretRef.key }}
            {{- else }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
            {{- if .Values.apiKeySecretRef.name }}
            - name: CLOACINA_BOOTSTRAP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecretRef.name }}
                  key: {{ .Values.apiKeySecretRef.key }}
            {{- end }}
            {{- if eq .Values.fleet.actuator "kubernetes" }}
            # Fleet actuator (CLOACI-T-0814). Selects the K8s substrate; the
            # actuator scales a per-tenant cloacina-agent Deployment.
            - name: CLOACINA_FLEET_ACTUATOR
              value: "kubernetes"
            - name: CLOACINA_AGENT_IMAGE
              value: {{ .Values.fleet.agentImage | quote }}
            - name: CLOACINA_AGENT_SERVER_URL
              value: {{ .Values.fleet.agentServerUrl | default (printf "http://%s.%s.svc.cluster.local:%v" (include "cloacina-server.fullname" .) .Release.Namespace .Values.service.port) | quote }}
            # Agent pod resource requests/limits (CLOACI-T-0819) — applied by the
            # actuator to every cloacina-agent pod it creates.
            - name: CLOACINA_AGENT_CPU_REQUEST
              value: {{ .Values.fleet.agentResources.requests.cpu | quote }}
            - name: CLOACINA_AGENT_MEMORY_REQUEST
              value: {{ .Values.fleet.agentResources.requests.memory | quote }}
            - name: CLOACINA_AGENT_CPU_LIMIT
              value: {{ .Values.fleet.agentResources.limits.cpu | quote }}
            - name: CLOACINA_AGENT_MEMORY_LIMIT
              value: {{ .Values.fleet.agentResources.limits.memory | quote }}
            # Per-tenant agent NetworkPolicy (CLOACI-T-0819, REQ-007). The actuator
            # needs the server's namespace + pod selector so its egress rule can
            # allow agents → server. The namespace is THIS release's namespace; the
            # selector is the chart's selectorLabels (which the server pods carry).
            - name: CLOACINA_FLEET_NETWORK_POLICY
              value: {{ .Values.fleet.networkPolicy.enabled | quote }}
            {{- if .Values.fleet.networkPolicy.enabled }}
            - name: CLOACINA_SERVER_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: CLOACINA_SERVER_POD_SELECTOR
              value: {{ include "cloacina-server.selectorLabelsCSV" . | quote }}
            - name: CLOACINA_SERVER_PORT
              value: {{ .Values.service.port | quote }}
            - name: CLOACINA_FLEET_DNS_NAMESPACE
              value: {{ .Values.fleet.networkPolicy.dnsNamespace | quote }}
            {{- end }}
            {{- if .Values.fleet.compiler.enabled }}
            # A compiler per tenant (CLOACINA-T-1034): the server makes it in
            # the tenant's namespace and scales it with the tenant's build queue.
            - name: CLOACINA_TENANT_COMPILERS
              value: "true"
            - name: CLOACINA_TENANT_COMPILER_IMAGE
              value: {{ include "cloacina-server.tenantCompilerImage" . | quote }}
            {{- if .Values.fleet.compiler.databaseUrlSecretRef.name }}
            - name: CLOACINA_TENANT_COMPILER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fleet.compiler.databaseUrlSecretRef.name }}
                  key: {{ .Values.fleet.compiler.databaseUrlSecretRef.key }}
            {{- else if .Values.postgresql.enabled }}
            # The bundled database, by its full Service name: the compilers
            # run in the tenant namespaces, where the short name the server
            # uses does not resolve.
            - name: CLOACINA_TENANT_COMPILER_DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Release.Name }}-postgresql.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgresql.auth.database }}"
            {{- end }}
            - name: CLOACINA_TENANT_COMPILER_CARGO_FLAGS
              value: {{ join " " .Values.fleet.compiler.cargoFlags | quote }}
            {{- with .Values.fleet.compiler.vendorDir }}
            - name: CLOACINA_TENANT_COMPILER_VENDOR_DIR
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.fleet.compiler.devWorkspace }}
            - name: CLOACINA_TENANT_COMPILER_DEV_WORKSPACE
              value: {{ . | quote }}
            {{- end }}
            - name: CLOACINA_TENANT_COMPILER_TARGET_DIR
              value: {{ .Values.fleet.compiler.targetDir | quote }}
            {{- if .Values.fleet.compiler.buildTimeoutSeconds }}
            - name: CLOACINA_TENANT_COMPILER_BUILD_TIMEOUT_S
              value: {{ .Values.fleet.compiler.buildTimeoutSeconds | quote }}
            {{- end }}
            - name: CLOACINA_TENANT_COMPILER_POLL_INTERVAL_MS
              value: {{ .Values.fleet.compiler.pollIntervalMs | quote }}
            - name: CLOACINA_TENANT_COMPILER_COOLDOWN_S
              value: {{ .Values.fleet.compiler.cooldownSeconds | quote }}
            - name: CLOACINA_TENANT_COMPILER_CACHE_SIZE
              value: {{ .Values.fleet.compiler.cacheSize | quote }}
            - name: CLOACINA_TENANT_COMPILER_HARDENED
              value: {{ .Values.fleet.compiler.hardened | quote }}
            - name: CLOACINA_TENANT_COMPILER_CPU_REQUEST
              value: {{ .Values.fleet.compiler.resources.requests.cpu | quote }}
            - name: CLOACINA_TENANT_COMPILER_MEMORY_REQUEST
              value: {{ .Values.fleet.compiler.resources.requests.memory | quote }}
            - name: CLOACINA_TENANT_COMPILER_CPU_LIMIT
              value: {{ .Values.fleet.compiler.resources.limits.cpu | quote }}
            - name: CLOACINA_TENANT_COMPILER_MEMORY_LIMIT
              value: {{ .Values.fleet.compiler.resources.limits.memory | quote }}
            - name: CLOACINA_TENANT_COMPILER_EGRESS
              value: {{ .Values.fleet.compiler.egress | quote }}
            {{- with .Values.fleet.compiler.egressCidrs }}
            - name: CLOACINA_TENANT_COMPILER_EGRESS_CIDRS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.fleet.compiler.databaseCidrs }}
            - name: CLOACINA_TENANT_COMPILER_DATABASE_CIDRS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            # Wait for the database at start (CLOACINA-T-1035).
            - name: CLOACINA_DATABASE_WAIT_TIMEOUT_S
              value: {{ .Values.server.databaseWaitTimeoutSeconds | int64 | quote }}
            # Retention job (CLOACINA-T-1023).
            - name: CLOACINA_RUN_HISTORY_RETENTION_DAYS
              value: {{ .Values.retention.runHistoryDays | int64 | quote }}
            - name: CLOACINA_OUTBOX_ACKED_RETENTION_S
              value: {{ .Values.retention.outboxAckedSeconds | int64 | quote }}
            - name: CLOACINA_RETENTION_INTERVAL_S
              value: {{ .Values.retention.intervalSeconds | int64 | quote }}
            # Time limits of fleet tasks and graph firings (CLOACINA-T-1014).
            - name: CLOACINA_FLEET_TASK_TIMEOUT_S
              value: {{ .Values.fleetTaskTimeLimits.defaultSeconds | int64 | quote }}
            - name: CLOACINA_FLEET_TASK_TIMEOUT_MAX_S
              value: {{ .Values.fleetTaskTimeLimits.maxSeconds | int64 | quote }}
            # Where agents run graph firings (CLOACINA-T-1125).
            - name: CLOACINA_FLEET_GRAPH_FIRINGS
              value: {{ .Values.fleet.graphFirings | default "inline" | quote }}
            {{- if or .Values.alertWebhook.url .Values.alertWebhook.urlSecretRef.name }}
            # Alert webhook (CLOACINA-T-1024). Rendered only when a URL is set.
            - name: CLOACINA_ALERT_WEBHOOK_URL
              {{- if .Values.alertWebhook.urlSecretRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alertWebhook.urlSecretRef.name }}
                  key: {{ .Values.alertWebhook.urlSecretRef.key }}
              {{- else }}
              value: {{ .Values.alertWebhook.url | quote }}
              {{- end }}
            {{- with .Values.alertWebhook.events }}
            - name: CLOACINA_ALERT_WEBHOOK_EVENTS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: CLOACINA_ALERT_WEBHOOK_TIMEOUT_S
              value: {{ .Values.alertWebhook.timeoutSeconds | int64 | quote }}
            - name: CLOACINA_ALERT_WEBHOOK_MAX_ATTEMPTS
              value: {{ .Values.alertWebhook.maxAttempts | int64 | quote }}
            {{- if .Values.alertWebhook.publicBaseUrl }}
            - name: CLOACINA_PUBLIC_BASE_URL
              value: {{ .Values.alertWebhook.publicBaseUrl | quote }}
            {{- end }}
            {{- if .Values.alertWebhook.secretRef.name }}
            - name: CLOACINA_ALERT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alertWebhook.secretRef.name }}
                  key: {{ .Values.alertWebhook.secretRef.key }}
            {{- end }}
            {{- end }}
            # CLOACINA-T-1047: the warning and the hard limit on the size of a
            # task context. int64 keeps a large value out of float notation.
            - name: CLOACINA_CONTEXT_WARN_BYTES
              value: {{ .Values.context.warnBytes | int64 | quote }}
            - name: CLOACINA_CONTEXT_MAX_BYTES
              value: {{ .Values.context.maxBytes | int64 | quote }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /home/cloacina
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem requires emptyDirs for any writable paths.
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else }}
      # Default soft pod-anti-affinity (CLOACI-T-0819): prefer spreading server
      # replicas across hostnames so replicaCount>1 survives a single node loss,
      # without ever blocking scheduling (preferred, not required). Override by
      # setting .Values.affinity.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "cloacina-server.selectorLabels" . | nindent 20 }}
      {{- end }}
