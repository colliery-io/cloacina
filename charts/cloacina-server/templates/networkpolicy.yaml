{{- /*
NetworkPolicies of the release (CLOACINA-T-1025, CLOACINA-T-1032,
CLOACINA-T-1069). They need a CNI that enforces NetworkPolicy; on one that
does not, they change nothing. Traffic from the node a pod runs on (the kubelet
probes) is allowed whatever the policy.

  - server.networkPolicy: the API port (8080) of the server pods is open to
    the server pods, to the agent pods of the tenant namespaces (with
    fleet.actuator=kubernetes) and to server.networkPolicy.from. With it off
    the API port is open to every source.
  - metrics.networkPolicy: the metrics port is open only to
    metrics.networkPolicy.from. With it off the metrics port is open to every
    source.
  - The chart's compiler: its bind port (/health, /v1/status) is open to
    compiler.networkPolicy.from only (nobody by default), with
    server.networkPolicy on.
  - postgresql.networkPolicy: bundled Postgres is open to the server pods, the
    chart's compiler, the tenant compilers and postgresql.networkPolicy.from.
*/ -}}
{{- $serverPolicy := .Values.server.networkPolicy.enabled -}}
{{- $metricsPolicy := and .Values.metrics.enabled .Values.metrics.networkPolicy.enabled -}}
{{- if or $serverPolicy $metricsPolicy }}
# Ingress to the server pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloacina-server.fullname" . }}
  labels:
    {{- include "cloacina-server.labels" . | nindent 4 }}
spec:
  # The compiler pods carry the same name and instance labels; they have a
  # policy of their own below.
  podSelector:
    matchLabels:
      {{- include "cloacina-server.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values:
          - compiler
  policyTypes:
    - Ingress
  ingress:
    {{- if $serverPolicy }}
    # The API port: the server pods (a reactor inject forwarded to the replica
    # that owns the reactor), the agents, and the listed peers.
    - from:
        - podSelector:
            matchLabels:
              {{- include "cloacina-server.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: NotIn
                values:
                  - compiler
        {{- if eq .Values.fleet.actuator "kubernetes" }}
        # The agent pods in the tenant namespaces the actuator makes.
        - namespaceSelector:
            matchLabels:
              cloacina.managed: "true"
          podSelector:
            matchLabels:
              cloacina.managed: "true"
        {{- end }}
        {{- with .Values.server.networkPolicy.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    {{- else }}
    - ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if .Values.metrics.enabled }}
    {{- if .Values.metrics.networkPolicy.enabled }}
    {{- with .Values.metrics.networkPolicy.from }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.metrics.port }}
    {{- end }}
    {{- else }}
    - ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
    {{- end }}
    {{- end }}
{{- if include "cloacina-server.chartCompiler" . }}
---
# Ingress to the compiler pods: the bind port (/health and /v1/status) only
# from compiler.networkPolicy.from, the metrics port only from
# metrics.networkPolicy.from.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloacina-server.fullname" . }}-compiler
  labels:
    {{- include "cloacina-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: compiler
spec:
  podSelector:
    matchLabels:
      {{- include "cloacina-server.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: compiler
  policyTypes:
    - Ingress
  {{- $metricsRule := and .Values.metrics.enabled (or (not .Values.metrics.networkPolicy.enabled) .Values.metrics.networkPolicy.from) }}
  {{- $bindRule := or (not $serverPolicy) .Values.compiler.networkPolicy.from }}
  # An empty list admits nobody.
  ingress:{{ if not (or $bindRule $metricsRule) }} []{{ end }}
    {{- if $serverPolicy }}
    {{- with .Values.compiler.networkPolicy.from }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ splitList ":" $.Values.compiler.bind | last | int }}
    {{- end }}
    {{- else }}
    - ports:
        - protocol: TCP
          port: {{ splitList ":" .Values.compiler.bind | last | int }}
    {{- end }}
    {{- if .Values.metrics.enabled }}
    {{- if .Values.metrics.networkPolicy.enabled }}
    {{- with .Values.metrics.networkPolicy.from }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.metrics.port }}
    {{- end }}
    {{- else }}
    - ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- if and .Values.postgresql.enabled .Values.postgresql.networkPolicy.enabled }}
---
# Ingress to bundled Postgres: the server pods and the chart's compiler (they
# carry the chart's name and instance labels), the tenant compilers, and
# postgresql.networkPolicy.from.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    {{- include "cloacina-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cloacina-server.selectorLabels" . | nindent 14 }}
        {{- if and (eq .Values.fleet.actuator "kubernetes") .Values.fleet.compiler.enabled }}
        # The tenant compilers, in the tenant namespaces.
        - namespaceSelector:
            matchLabels:
              cloacina.managed: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloacina-compiler
        {{- end }}
        {{- with .Values.postgresql.networkPolicy.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
