{{- if .Values.reactorAffinity.enabled }}
# Headless Service giving each server replica a STABLE PER-POD DNS NAME
# (CLOACI-T-0851 / ADR CLOACI-A-0012 Amendment 3).
#
# Why this exists: under per-reactor leadership exactly one replica owns a given
# reactor. An inject that lands on a different replica must be steered to the
# owner, and the owner therefore has to publish an address another replica can
# reach. Replicas otherwise sit behind the load-balanced Service and have no
# individually addressable name.
#
# A Pod whose spec sets `subdomain` to THIS service's name gets the DNS record
#     <pod-name>.<subdomain>.<namespace>.svc.<cluster-domain>
# (hostname defaults to the pod name). That is what each replica advertises when
# it claims a reactor.
#
# `publishNotReadyAddresses: true` is deliberate and load-bearing: a replica
# claims reactors during startup, BEFORE it passes its readiness probe. Without
# this, a freshly-elected owner would be un-addressable during exactly the
# window in which other replicas most need to reach it, and injects would fall
# back to the durable outbox path for no reason.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloacina-server.fullname" . }}-headless
  labels:
    {{- include "cloacina-server.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cloacina-server.selectorLabels" . | nindent 4 }}
{{- end }}
