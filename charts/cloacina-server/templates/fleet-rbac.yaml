{{- if eq .Values.fleet.actuator "kubernetes" }}
# ---------------------------------------------------------------------------
# Fleet actuator RBAC (CLOACI-T-0814, REQ-006 + REQ-007)
#
# Rendered ONLY when fleet.actuator=kubernetes. Grants the server the LEAST
# privilege its Kubernetes actuator needs to scale a per-tenant cloacina-agent
# Deployment in the tenant's own namespace:
#
#   - It creates one namespace per tenant (cloacina-tenant-<t>), which is
#     cluster-scoped — hence a ClusterRole, not a namespaced Role.
#   - Inside each tenant namespace it manages one Deployment per agent pool
#     (CLOACINA-T-1021; `cloacina-agent` for the pool `default`,
#     `cloacina-agent-<pool>` for another), one Secret (the agent key), one
#     NetworkPolicy for the tenant and one per pool, and the ServiceAccount a
#     pool names. It patches each Deployment's replica count.
#   - With fleet.compiler.enabled it also manages the tenant's compiler
#     (CLOACINA-T-1034): one Deployment `cloacina-compiler`, one Secret
#     `cloacina-compiler-db` (the compiler's database URL) and one
#     NetworkPolicy `cloacina-compiler`. These need no verb that the rules
#     below do not have already. Its cache claim `cloacina-compiler-cache`
#     (CLOACINA-T-1117) has its own rule.
#
# NO cluster-admin. NO wildcard ("*") verbs or resources. Every rule below is
# enumerated and justified.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloacina-server.fleetServiceAccountName" . }}
  labels:
    {{- include "cloacina-server.labels" . | nindent 4 }}
  {{- with .Values.fleet.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloacina-server.fleetServiceAccountName" . }}
  labels:
    {{- include "cloacina-server.labels" . | nindent 4 }}
rules:
  # Per-tenant namespace provisioning (REQ-007). The actuator ensures each
  # namespace with server-side apply (a single create-or-update call), which the
  # API server authorizes as `create` + `patch`. Namespaces are cluster-scoped,
  # so this rule MUST live in a ClusterRole. No `get`/`list` (apply doesn't read
  # first) and no `delete` (deprovision scales to zero — it never deletes the
  # namespace), keeping the blast radius minimal.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "patch"]
  # The agent Deployment of each pool. `create` + `patch` for the server-side
  # apply that ensures it and the merge-patch that sets the replica count (scale
  # up/down); `get` to read the ready-replica count and the id of the agent key
  # that the pod template names (CLOACINA-T-1055) during reconcile. `delete`
  # for the removal of a pool (CLOACINA-T-1021): the server deletes the pool's
  # Deployment by name, and only after it checked that the pool has no agents.
  # A tenant's deprovision still scales to zero and deletes nothing. No `list`
  # (addressed by name). The tenant's compiler Deployment (CLOACINA-T-1034)
  # uses the same four: applied, read for its replica count and the marker of
  # its build role password (CLOACINA-T-1063), scaled, and deleted when the
  # tenant is removed.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "patch"]
  # The ServiceAccount a pool's agents run as (CLOACINA-T-1021), with the
  # annotations of the pool's settings (a cloud workload identity). Ensured via
  # server-side apply → `create` + `patch`. No `get`/`list`, and no `delete`: a
  # ServiceAccount stays when its pool is removed. This lets the server write
  # annotations on a ServiceAccount of any namespace, as the Secret rule lets it
  # write Secrets; the actuator only writes in tenant namespaces.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "patch"]
  # The per-tenant agent key, delivered to agent pods as CLOACINA_API_KEY. Also
  # ensured via server-side apply → `create` + `patch`. No `get`/`list` (apply
  # doesn't read; addressed by its known name), no `update` (apply is a patch),
  # no `delete`. The compiler's database URL (CLOACINA-T-1034) is a second
  # Secret, written the same way; with no `delete`, the server writes an empty
  # value over it when the tenant is removed.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]
  # The per-tenant agent NetworkPolicy (CLOACI-T-0819, REQ-007 defense-in-depth):
  # default-deny ingress, egress to DNS + the server only; and one NetworkPolicy
  # per pool with the pool's extra egress rules (CLOACINA-T-1021). Ensured via
  # server-side apply → `create` + `patch`. `delete` for the removal of a pool
  # (its own policy, by name), and of a removed tenant's compiler policy
  # (CLOACINA-T-1034). No `get`/`list`. Rendered
  # regardless of fleet.networkPolicy.enabled so toggling the policy on later
  # never requires re-granting RBAC (the actuator simply stops calling
  # ensure_network_policy when disabled).
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "patch"]
  # The cache claim of a tenant's compiler (CLOACINA-T-1117):
  # `cloacina-compiler-cache` in the tenant's namespace. `get` to see whether
  # it exists, `create` to make it once (no `patch`: a claim that exists is
  # never changed), `delete` when the tenant is removed. No `list`, no
  # `update`. Rendered with the actuator whatever fleet.compiler.cacheClaim
  # says, so turning the claim on later needs no new grant.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cloacina-server.fleetServiceAccountName" . }}
  labels:
    {{- include "cloacina-server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cloacina-server.fleetServiceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cloacina-server.fleetServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
