{{- if include "cloacina-server.chartCompiler" . }}
{{- include "cloacina-server.validateDatabase" . -}}
# The cloacina-compiler builds the packages of the public schema, with the
# database URL the chart is given: the single-trust install. With the fleet
# compilers on (fleet.actuator=kubernetes, fleet.compiler.enabled), the server
# runs public's compiler like every tenant's, with public's build role, and
# this Deployment is not rendered (CLOACINA-T-1063).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloacina-server.fullname" . }}-compiler
  labels:
    {{- include "cloacina-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: compiler
spec:
  # One compiler claims the pending builds of public.
  replicas: {{ .Values.compiler.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cloacina-server.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: compiler
  template:
    metadata:
      labels:
        {{- include "cloacina-server.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: compiler
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cloacina-compiler
          image: {{ include "cloacina-server.compilerImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--bind"
            - {{ .Values.compiler.bind | quote }}
            - "--database-url"
            # Kubernetes expands $(DATABASE_URL) from the env below, so a
            # secret-sourced URL never appears literally in the manifest/argv.
            - "$(DATABASE_URL)"
            {{- if .Values.metrics.enabled }}
            - "--metrics-bind"
            - {{ printf "0.0.0.0:%v" .Values.metrics.port | quote }}
            {{- end }}
            - "--poll-interval-ms"
            - {{ .Values.compiler.pollIntervalMs | quote }}
            {{- with .Values.compiler.python }}
            {{- range .platforms }}
            - "--python-platform"
            - {{ . | quote }}
            {{- end }}
            {{- if .version }}
            - "--python-version"
            - {{ .version | quote }}
            {{- end }}
            {{- if .wheelDir }}
            - "--python-wheel-dir"
            - {{ .wheelDir | quote }}
            {{- end }}
            {{- if .uvCacheDir }}
            - "--python-uv-cache-dir"
            - {{ .uvCacheDir | quote }}
            {{- end }}
            {{- if .offline }}
            - "--python-offline"
            {{- end }}
            {{- end }}
            {{- range .Values.compiler.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            # Not `metrics`: the server's metrics Service selects by the name
            # and instance labels, which these pods carry too, and finds its
            # endpoints by that port name.
            - name: cmp-metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- end }}
          env:
            {{- if .Values.postgresql.enabled }}
            # The password of bundled Postgres, from its Secret
            # (CLOACINA-T-1069).
            - name: CLOACINA_BUNDLED_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(CLOACINA_BUNDLED_DB_PASSWORD)@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
            {{- else if .Values.databaseUrlSecretRef.name }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseUrlSecretRef.name }}
                  key: {{ .Values.databaseUrlSecretRef.key }}
            {{- else }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
            {{- if .Values.compiler.python.indexUrl }}
            # In the environment, not in the arguments: the compiler gives it
            # to uv the same way.
            - name: CLOACINA_COMPILER_PYTHON_INDEX_URL
              value: {{ .Values.compiler.python.indexUrl | quote }}
            {{- end }}
            # The unpack limit of the server (CLOACINA-T-1106): the compiler
            # refuses a package that unpacks to more, and a vendored set the
            # loader would refuse.
            - name: CLOACINA_MAX_UNPACKED_BYTES
              value: {{ .Values.packages.maxUnpackedBytes | int64 | quote }}
            {{- with .Values.compiler.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.compiler.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.compiler.securityContext | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem requires emptyDirs for cargo's writable
            # paths — the build target cache, tmp, and the cargo/rustup homes.
            - name: target
              mountPath: /workspace/target
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/cloacina
      volumes:
        - name: target
          emptyDir:
            sizeLimit: {{ .Values.compiler.buildCacheSize }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
