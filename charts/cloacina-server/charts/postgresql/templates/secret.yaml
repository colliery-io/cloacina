---
{{/*
CLOACI-T-0610 — secret holding the postgres user/password/database.
Mounted into the pod's env so the official `postgres` image picks
them up via POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB on first
boot.

CLOACINA-T-1069: the password is `auth.password` when it is set. Else it is
the password of the Secret that exists (`lookup`, so a `helm upgrade` keeps
it), else a generated one. The server and the compiler read it from this
Secret. `helm template` and `--dry-run` cannot look up, and show a new value.
*/}}
{{- $name := include "postgresql.fullname" . -}}
{{- $password := .Values.auth.password -}}
{{- if not $password -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing $existing.data (index $existing.data "POSTGRES_PASSWORD") -}}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_DB: {{ .Values.auth.database | quote }}
