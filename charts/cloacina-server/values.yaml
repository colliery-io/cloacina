---
# Default values for cloacina-server.
# CLOACI-I-0111 / T-0605.

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  repository: ghcr.io/colliery-io/cloacina-server
  # Defaults to .Chart.AppVersion when empty so a `helm install` without
  # --set image.tag pins to the chart's stated app version.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ---------------------------------------------------------------------------
# Replicas + scheduling
# ---------------------------------------------------------------------------
replicaCount: 1

# Strategy. RollingUpdate is the right default — server is HTTP-stateless
# (state lives in Postgres), connections drain naturally.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

nodeSelector: {}
tolerations: []
# Pod affinity/anti-affinity. Leave empty ({}) to get the chart's DEFAULT soft
# pod-anti-affinity (CLOACI-T-0819): a preferred (whenUnsatisfiable-equivalent)
# spread of server replicas across hostnames, so replicaCount>1 lands on
# different nodes when possible without ever blocking scheduling. Set any value
# here to fully override the default.
affinity: {}

# ---------------------------------------------------------------------------
# High availability (CLOACI-T-0819)
#
# The server is safe to run with replicaCount>1:
#   - the autoscaler/reconciler leader is gated by a Postgres advisory lock
#     (ADR CLOACI-A-0008), so extra replicas serve HTTP without double-driving
#     the control loop;
#   - an execution agent may post a task result to any replica: a replica that
#     did not dispatch the task stores the result in Postgres and the replica
#     that waits for it takes it (CLOACINA-T-1015). No session affinity is
#     needed on the Service.
# A replica that stops loses the result waits it held; those tasks run again
# (tasks on the fleet must be safe to run twice).
# A PodDisruptionBudget keeps a minimum available during voluntary disruptions
# (node drains, rolling updates).
#
# NOTE: there is deliberately NO HorizontalPodAutoscaler. The control-plane
# back-pressure autoscaler is the scaling mechanism — it sees per-tenant signal
# (utilization, limits) that an HPA's CPU/memory metrics cannot.
# ---------------------------------------------------------------------------
podDisruptionBudget:
  # Rendered only when enabled AND replicaCount > 1 (a PDB over a single replica
  # would block all voluntary disruption of that pod).
  enabled: true
  minAvailable: 1

# ---------------------------------------------------------------------------
# Resources — modest defaults; bump for production load.
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# ---------------------------------------------------------------------------
# Database
#
# Two paths:
#   1. database.url  — bring-your-own-Postgres. Recommended for prod.
#                       Set databaseUrlSecretRef instead if the URL contains
#                       credentials you don't want in values.
#   2. postgresql.enabled=true — install Bitnami's postgresql subchart in-cluster.
#                       Convenient for demos and dev clusters.
# ---------------------------------------------------------------------------
database:
  # Plaintext URL. Mutually exclusive with databaseUrlSecretRef.
  url: ""

databaseUrlSecretRef:
  # Name of an existing Secret holding the DATABASE_URL value.
  name: ""
  # Key inside that Secret.
  key: DATABASE_URL

# Embedded Postgres subchart (CLOACI-T-0610). Disabled by default —
# operators bring their own managed Postgres in production. Enabled
# instances run a single Deployment + Service + PVC around the
# official docker.io/library/postgres image.
#
# All values here are forwarded to the local `charts/postgresql/`
# subchart; full surface lives at
# `charts/cloacina-server/charts/postgresql/values.yaml`.
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "17"
  auth:
    username: cloacina
    password: cloacina
    database: cloacina
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""

# ---------------------------------------------------------------------------
# API key bootstrap
#
# On first start cloacina-server generates an admin API key and prints it
# to stdout. To pin a known value, store it in a Secret and reference it
# here — the chart wires it as CLOACINA_BOOTSTRAP_KEY.
# ---------------------------------------------------------------------------
apiKeySecretRef:
  name: ""
  key: bootstrap-key

# ---------------------------------------------------------------------------
# Server CLI knobs
# ---------------------------------------------------------------------------
server:
  bind: "0.0.0.0:8080"
  # When true, `cloacina-server` rejects unsigned packages.
  requireSignatures: false
  # Trusted org UUID for signature verification — required if requireSignatures.
  verificationOrgId: ""
  # Warning limit on per-tenant DefaultRunner instances; none is stopped at it.
  tenantRunnerCacheSize: 256
  # Drain timeout (seconds) for in-flight workflows during tenant deletion.
  tenantDeletionDrainTimeoutSeconds: 30
  # Extra environment vars merged into the container's env list.
  # Example:
  #   extraEnv:
  #     - name: RUST_LOG
  #       value: info,cloacina=debug
  extraEnv: []

# ---------------------------------------------------------------------------
# Fleet actuator (CLOACI-I-0127 / T-0814)
#
# The server can auto-scale a per-tenant pool of cloacina-agent workloads.
# `actuator` selects the substrate and is OFF by default — existing installs
# are completely unchanged (no ServiceAccount, no RBAC, no actuator env are
# rendered unless you opt in).
#
#   none        — actuation off (default).
#   kubernetes  — scale a per-tenant `cloacina-agent` Deployment in the
#                 tenant's OWN namespace (REQ-007). Renders the least-privilege
#                 RBAC below (REQ-006) and binds it to the server pod.
#
# The Docker actuator (CLOACINA_FLEET_ACTUATOR=docker) is a dev-only substrate
# and is not offered through this chart.
# ---------------------------------------------------------------------------
fleet:
  actuator: none

  # Agent image the actuator runs for each tenant (CLOACINA_AGENT_IMAGE).
  agentImage: ghcr.io/colliery-io/cloacina-agent:latest

  # Server URL injected into spawned agents as CLOACINA_SERVER
  # (CLOACINA_AGENT_SERVER_URL). Empty → the release's in-cluster Service FQDN
  # (http://<fullname>.<namespace>.svc.cluster.local:<port>). The FQDN is required
  # because agents run in per-tenant namespaces (cloacina-tenant-<t>), from which
  # the short Service name does not resolve.
  agentServerUrl: ""

  # ServiceAccount the server runs as when the actuator is enabled. The chart
  # creates it (and the RBAC below) only when actuator=kubernetes.
  serviceAccount:
    # Name override; empty → "<fullname>-fleet".
    name: ""
    annotations: {}

  # Resource requests + limits for each actuator-created cloacina-agent pod
  # (CLOACI-T-0819), rendered as CLOACINA_AGENT_* env on the server and applied
  # by the actuator. Tuned to the agent's real footprint: it embeds a CPython
  # interpreter (PyO3) and unpacks a workflow/+vendor/ tree, so the memory limit
  # is generous to avoid OOM-killing a Python-packaged workflow.
  agentResources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Per-tenant agent NetworkPolicy (CLOACI-T-0819, REQ-007 defense-in-depth).
  # When enabled, the actuator installs a NetworkPolicy in each tenant namespace:
  # default-deny ingress, egress allowed ONLY to cluster DNS + the cloacina-server.
  # This is defense-in-depth — the server-side ABAC (NFR-004) remains the real
  # tenant-isolation boundary; the policy never weakens a server-side check.
  # Defaults ON when actuator=kubernetes; set enabled=false to disable.
  networkPolicy:
    enabled: true
    # Namespace the cluster DNS service runs in (DNS egress is allowed there).
    dnsNamespace: kube-system

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080
  annotations: {}

# ---------------------------------------------------------------------------
# Reactor affinity (CLOACI-T-0851 / ADR CLOACI-A-0012 Amendment 3)
# ---------------------------------------------------------------------------
# Under per-reactor leadership exactly ONE replica runs a given reactor. An
# event injected on any other replica must reach the owner. Steering the
# request to the owner keeps injection on the hot path; relaying it through the
# durable outbox instead would put steady-state stream ingest on Postgres.
#
# Enabling this makes each replica advertise its POD IP when it claims a
# reactor. (Pod IP rather than a per-pod DNS name: Kubernetes only creates
# per-pod A records when a pod sets both `hostname` and `subdomain`, which
# Deployment replicas cannot do distinctly — and a stale IP self-corrects
# because the address is republished on every claim.)
#
# Only meaningful with replicaCount > 1. A single-replica deployment always owns
# every reactor locally, so there is nothing to steer and leaving this off costs
# nothing.
reactorAffinity:
  # Inject CLOACINA_ADVERTISED_ADDRESS (http://<podIP>:<service.port>).
  enabled: false

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: cloacina.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: cloacina-tls
  #   hosts:
  #     - cloacina.example.com

# ---------------------------------------------------------------------------
# Probes — kubelet hits /health (liveness, startup) and /ready (readiness).
# Server registers both at the root, not under /v1/.
# ---------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 60

# ---------------------------------------------------------------------------
# Pod / container security
#
# The image runs as uid/gid 10001 by default; reflect that here so any
# admission controller (PodSecurity, Kyverno) is happy.
# ---------------------------------------------------------------------------
podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# A small writable volume for /home/cloacina (cloacina-server writes
# nothing critical there but readOnlyRootFilesystem still requires
# emptyDirs for any tmp use).
podAnnotations: {}
podLabels: {}

# ---------------------------------------------------------------------------
# Compiler (CLOACI-I-0111)
#
# The cloacina-compiler builds uploaded Rust packages. Enable it to compile
# packages in-cluster; without it, uploaded Rust packages stay `pending`.
# Tenant-level isolation is the security boundary (run one compiler per
# tenant via --tenant-schema); the per-build process sandbox was excised
# 2026-07-11 and may return as an optional layer later.
# ---------------------------------------------------------------------------
compiler:
  enabled: false
  replicaCount: 1
  image:
    # Defaults to the server repo with `-compiler` swapped in, tag = AppVersion.
    repository: ""
    tag: ""
  bind: "0.0.0.0:9000"
  pollIntervalMs: 1000
  # Extra CLI args, e.g. ["--cargo-flags-replace=build", "--cargo-flags-replace=--lib"]
  # (full override of the default cargo flag list, dropping --frozen/--offline
  # for online in-cluster builds) or ["--tenant-schema", "acme"] for a
  # per-tenant build-isolation compiler. `--cargo-flag=<flag>` APPENDS to the
  # defaults instead.
  extraArgs:
    - "--cargo-flags-replace=build"
    - "--cargo-flags-replace=--lib"
  extraEnv: []
  # Python packages (CLOACINA-T-1073). A package that is published with a
  # requirements.lock and no vendor/ folder gets its dependencies from the
  # compiler: uv installs the wheels the lock names, for each platform below,
  # and the compiler stores one set per platform. The compiler image must hold
  # uv. A package that ships vendor/ is used as it is.
  python:
    # The platforms to vendor for, as <arch>-<os>. Empty: the compiler's
    # default, the two platforms of the official agent image (aarch64-linux
    # and x86_64-linux). A server or an agent on a platform that is not listed
    # cannot load a package the compiler vendored.
    platforms: []
    # The Python the wheels are for (major.minor). Empty: the compiler's
    # default, 3.11, the Python of the official server and agent images.
    version: ""
    # The package index that wheels are downloaded from. Empty: PyPI. For a
    # URL with a password, leave this empty and set
    # CLOACINA_COMPILER_PYTHON_INDEX_URL from a Secret through
    # compiler.extraEnv.
    indexUrl: ""
    # A folder of wheel files in the compiler image. Wheels in it are used
    # before a download.
    wheelDir: ""
    # No network for Python builds: every wheel must be in wheelDir (or, with
    # no wheelDir, in the uv cache). A build that needs another wheel fails
    # and names it.
    offline: false
    # The cache folder of uv. The root filesystem of the pod is read-only, so
    # the default is on the /tmp emptyDir. For offline builds from a cache
    # that is baked into the image, name that folder and make the image's
    # folder writable by the compiler's user.
    uvCacheDir: /tmp/uv-cache
  # emptyDir size limit for the shared cargo target cache.
  buildCacheSize: 8Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # Mirrors the server container hardening.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# ---------------------------------------------------------------------------
# Metrics listener (CLOACINA-T-1025, CLOACINA-T-1032)
#
# /metrics has no authentication, and its labels hold tenant names, workflow
# names and other names that tenants choose. The chart keeps it off the API
# port: the server starts a second listener for /metrics on metrics.port (its
# --metrics-bind), and the API port (8080) answers 404 for /metrics.
#
# With metrics.enabled=true the chart adds a container port `metrics` and a
# ClusterIP Service "<fullname>-metrics", and the ServiceMonitor (when enabled)
# scrapes that Service. With compiler.enabled=true the compiler pods get the
# same: --metrics-bind on metrics.port, a container port `cmp-metrics`, a
# ClusterIP Service "<fullname>-compiler-metrics" and a ServiceMonitor.
#
# metrics.enabled=false puts /metrics back on the API port (and on the
# compiler's bind port), where every client that can reach the API can read
# it. No metrics Service and no NetworkPolicy is rendered then.
# ---------------------------------------------------------------------------
metrics:
  enabled: true
  port: 9090

  # NetworkPolicy for the server pods (and the compiler pods, when the
  # compiler is enabled). Rendered only with metrics.enabled=true. It needs a
  # CNI that enforces NetworkPolicy; on a CNI that does not, it changes nothing.
  #   - the API port (and the compiler's bind port) stays open to every
  #     source, as without a policy;
  #   - the metrics port is open only to the peers in `from`;
  #   - every other ingress to those pods is refused.
  # `from` is a list of NetworkPolicy peers. The default, an empty list, admits
  # nobody to the metrics port: name your Prometheus here. Example, for a
  # Prometheus in the namespace `monitoring`:
  #   from:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: monitoring
  #       podSelector:
  #         matchLabels:
  #           app.kubernetes.io/name: prometheus
  networkPolicy:
    enabled: true
    from: []

# ---------------------------------------------------------------------------
# ServiceMonitor (Prometheus operator)
#
# Scrapes /metrics on the metrics Service (and on the compiler's metrics
# Service, when the compiler is enabled). With metrics.enabled=false it scrapes
# the API Service. The Prometheus pods must be among the peers in
# metrics.networkPolicy.from.
# ---------------------------------------------------------------------------
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
