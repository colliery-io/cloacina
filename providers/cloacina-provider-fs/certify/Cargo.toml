# CLOACI-T-0872 — the CERTIFICATION harness for `cloacina-provider-fs`.
#
# This is the wave's certify step: cloacina core deps resolve from CRATES.IO
# (version pins, never path deps, never local patching) while the provider
# itself is taken from the sibling directory (`..`) — the exact shape a
# consumer experiences, proving the ship-form provider against RELEASED core.
# `cargo run --release` here: packages the provider to a WASM component via
# the published packaging API, loads it via the published loader, and runs
# all three grant cases E2E (granted read / default-closed denial / granted
# write). Exit 0 == the compat claim "provider works against core 0.10" is
# EARNED. (Recipe proven by the 2026-07-31 dry-run, which also caught real
# API drift on first contact — see T-0872's journal.)
[package]
name = "certify-fs"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
cloacina = { version = "0.10", features = ["constructors-wasm"] }
cloacina-workflow = "0.10"
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
bincode = "1.3"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cloacina-build = "0.10"
