# tiberius-wasm: a minimal fork of tiberius 0.12.3 (upstream prisma/tiberius is
# dormant) that builds for wasm32-wasip2, moved from weir's weir-tiberius with
# the MSSQL connector (COLLIERY-I-0633, CLOACINA-T-0984). The delta, kept
# deliberately tiny:
#   1. `rustls` feature rebuilt on rustls 0.23 with the pure-Rust
#      rustls-rustcrypto provider + webpki-roots: the stock backends
#      (tokio-rustls/native-tls/opentls) cannot build for wasm32-wasip2.
#   2. An inline-PEM trust API (`Config::trust_cert_pem`): guests have no
#      filesystem, so path-based CA loading is unusable there.
#   3. The 32-bit PLP "unknown size" sentinel literals made portable.
# Everything else is upstream 0.12.3 verbatim, under upstream's licence
# (MIT or Apache-2.0). Standalone workspace: a path dependency of the mssql
# connector (its own workspace), never of the host.
[workspace]

[package]
name = "tiberius-wasm"
version = "0.12.3"
edition = "2021"
description = "A wasm32-wasip2-capable fork of the tiberius TDS (MSSQL) driver"
license = "MIT/Apache-2.0"
repository = "https://github.com/colliery-io/cloacina"
publish = false

[lib]
# Keep the crate name `tiberius` so the mssql guest's imports are unchanged.
name = "tiberius"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
asynchronous-codec = "0.6"
byteorder = "1.0"
bytes = "1.0"
connection-string = "0.2"
encoding_rs = "0.8"
enumflags2 = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["io", "sink"] }
num-traits = "0.2"
once_cell = "1.3"
pin-project-lite = "0.2"
pretty-hex = "0.3"
thiserror = "1.0"
tracing = { version = "0.1", features = ["log"] }
uuid = "1.0"

# Optional value-type features (unchanged from upstream; weir enables none).
chrono = { version = "0.4", optional = true, default-features = false }
time = { version = "0.3", optional = true }
rust_decimal = { version = "1.6", optional = true }
bigdecimal_ = { version = "0.3", optional = true, package = "bigdecimal" }

# The rebuilt `rustls` feature (fork delta #1): rustls driven DIRECTLY over the
# futures-io stream (no tokio, no futures-rustls — its handshake drain loop
# deadlocks on always-ready blocking transports like the wasm guest's SyncSock);
# provider supplied explicitly (rustls-rustcrypto — ring/aws-lc need a wasi-sdk
# clang and don't build for wasm32-wasip2).
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "logging"] }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
rustls-pki-types = { version = "1.11", optional = true }
webpki-roots = { version = "0.26", optional = true }

[features]
default = ["tds73"]
tds73 = []
rustls = ["dep:rustls", "rustls-rustcrypto", "rustls-pki-types", "webpki-roots"]
bigdecimal = ["bigdecimal_"]
docs = []

[profile.release]
opt-level = "s"
lto = true
strip = true

# Upstream's code stays as upstream wrote it: its cfg names for the features
# this fork dropped, and its deprecated std calls.
[lints.rust]
unexpected_cfgs = "allow"
deprecated = "allow"
