# A declarative source in Airbyte's low-code format, moved from weir (CLOACINA-T-0992).
# Authored solely from Slack Web API's official API documentation
# (https://api.slack.com/methods); no third-party connector implementation was consulted.
# License: Apache-2.0 (this repo).
type: DeclarativeSource

streams:
  # ---------------------------------------------------------------
  # Stream: conversations
  # Source: GET https://slack.com/api/conversations.list
  # Records live in the top-level "channels" array.
  # ---------------------------------------------------------------
  - type: DeclarativeStream
    name: conversations
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "https://slack.com/api"
        path: "/conversations.list"
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['api_token'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["channels"]
      paginator:
        type: DefaultPaginator
        pagination_strategy:
          type: CursorPagination
          # Slack returns the next-page token at response_metadata.next_cursor.
          cursor_value: "{{ response['response_metadata']['next_cursor'] }}"
        page_token_option:
          type: RequestOption
          field_name: "cursor"
          inject_into: request_parameter
    # incremental_sync OMITTED — conversations.list documents no
    # server-side time-filter query parameter. See Open questions #2.
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          id:                     { type: string }
          name:                   { type: ["null", "string"] }
          name_normalized:        { type: ["null", "string"] }
          creator:                { type: ["null", "string"] }
          created:                { type: ["null", "integer"] }
          updated:                { type: ["null", "integer"] }
          unlinked:               { type: ["null", "integer"] }
          num_members:            { type: ["null", "integer"] }
          is_channel:             { type: ["null", "boolean"] }
          is_group:               { type: ["null", "boolean"] }
          is_im:                  { type: ["null", "boolean"] }
          is_mpim:                { type: ["null", "boolean"] }
          is_private:             { type: ["null", "boolean"] }
          is_archived:            { type: ["null", "boolean"] }
          is_general:             { type: ["null", "boolean"] }
          is_shared:              { type: ["null", "boolean"] }
          is_ext_shared:          { type: ["null", "boolean"] }
          is_org_shared:          { type: ["null", "boolean"] }
          is_pending_ext_shared:  { type: ["null", "boolean"] }
          is_member:              { type: ["null", "boolean"] }
          pending_shared:         { type: ["null", "array"] }
          previous_names:         { type: ["null", "array"] }
          topic:
            type: ["null", "object"]
            properties:
              value:    { type: ["null", "string"] }
              creator:  { type: ["null", "string"] }
              last_set: { type: ["null", "integer"] }
          purpose:
            type: ["null", "object"]
            properties:
              value:    { type: ["null", "string"] }
              creator:  { type: ["null", "string"] }
              last_set: { type: ["null", "integer"] }

  # ---------------------------------------------------------------
  # Stream: users
  # Source: GET https://slack.com/api/users.list
  # Records live in the top-level "members" array.
  # ---------------------------------------------------------------
  - type: DeclarativeStream
    name: users
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "https://slack.com/api"
        path: "/users.list"
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['api_token'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["members"]
      paginator:
        type: DefaultPaginator
        pagination_strategy:
          type: CursorPagination
          cursor_value: "{{ response['response_metadata']['next_cursor'] }}"
        page_token_option:
          type: RequestOption
          field_name: "cursor"
          inject_into: request_parameter
    # incremental_sync OMITTED — users.list documents no server-side
    # time-filter query parameter. See Open questions #2.
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          id:                  { type: string }
          team_id:             { type: ["null", "string"] }
          name:                { type: ["null", "string"] }
          real_name:           { type: ["null", "string"] }
          color:               { type: ["null", "string"] }
          tz:                  { type: ["null", "string"] }
          tz_label:            { type: ["null", "string"] }
          tz_offset:           { type: ["null", "integer"] }
          updated:             { type: ["null", "integer"] }
          deleted:             { type: ["null", "boolean"] }
          is_admin:            { type: ["null", "boolean"] }
          is_owner:            { type: ["null", "boolean"] }
          is_primary_owner:    { type: ["null", "boolean"] }
          is_restricted:       { type: ["null", "boolean"] }
          is_ultra_restricted: { type: ["null", "boolean"] }
          is_bot:              { type: ["null", "boolean"] }
          is_app_user:         { type: ["null", "boolean"] }
          has_2fa:             { type: ["null", "boolean"] }
          profile:
            type: ["null", "object"]
            properties:
              avatar_hash:            { type: ["null", "string"] }
              status_text:            { type: ["null", "string"] }
              status_emoji:           { type: ["null", "string"] }
              real_name:              { type: ["null", "string"] }
              real_name_normalized:   { type: ["null", "string"] }
              display_name:           { type: ["null", "string"] }
              display_name_normalized: { type: ["null", "string"] }
              first_name:             { type: ["null", "string"] }
              last_name:              { type: ["null", "string"] }
              email:                  { type: ["null", "string"] }
              title:                  { type: ["null", "string"] }
              phone:                  { type: ["null", "string"] }
              skype:                  { type: ["null", "string"] }
              team:                   { type: ["null", "string"] }
              image_24:               { type: ["null", "string"] }
              image_32:               { type: ["null", "string"] }
              image_48:               { type: ["null", "string"] }
              image_72:               { type: ["null", "string"] }
              image_192:              { type: ["null", "string"] }
              image_512:              { type: ["null", "string"] }
              image_original:         { type: ["null", "string"] }
