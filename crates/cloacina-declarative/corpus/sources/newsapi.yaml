# A declarative source in Airbyte's low-code format, moved from weir (CLOACINA-T-0992).
# Authored solely from NewsAPI.org's official API documentation
# (https://newsapi.org/docs); no third-party connector implementation was consulted.
# License: Apache-2.0 (this repo).
type: DeclarativeSource

streams:
  # ──────────────────────────────────────────────────────────
  # Stream 1: everything
  # Endpoint: GET https://newsapi.org/v2/everything
  # ──────────────────────────────────────────────────────────
  - type: DeclarativeStream
    name: everything
    primary_key: url          # url is the only unique-per-article field documented; see open questions

    retriever:
      type: SimpleRetriever

      requester:
        type: HttpRequester
        url_base: "https://newsapi.org"
        path: "/v2/everything"
        authenticator:
          type: ApiKeyAuthenticator
          header: "X-Api-Key"
          api_token: "{{ config['api_key'] }}"

      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["articles"]   # response envelope: { status, totalResults, articles: [...] }

      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: "pageSize"     # docs: "pageSize — 1–100; default 100"
        page_token_option:
          type: RequestOption
          field_name: "page"         # docs: "page — default 1"
        pagination_strategy:
          type: PageIncrement
          page_size: 100             # docs max is 100; default for /everything is 100

    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: publishedAt      # article field: "date and time the article was published, in UTC"
      start_time_option:
        type: RequestOption
        field_name: "from"           # docs: "from — oldest article date/time allowed; ISO 8601"

    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          source:
            type: ["null", "object"]
            properties:
              id:   { type: ["null", "string"] }
              name: { type: ["null", "string"] }
          author:      { type: ["null", "string"] }
          title:       { type: ["null", "string"] }
          description: { type: ["null", "string"] }
          url:         { type: ["null", "string"] }
          urlToImage:  { type: ["null", "string"] }
          publishedAt: { type: string, format: date-time }
          content:     { type: ["null", "string"] }   # docs: "truncated to 200 chars"

  # ──────────────────────────────────────────────────────────
  # Stream 2: top_headlines
  # Endpoint: GET https://newsapi.org/v2/top-headlines
  # ──────────────────────────────────────────────────────────
  - type: DeclarativeStream
    name: top_headlines
    primary_key: url          # same rationale as above; see open questions

    retriever:
      type: SimpleRetriever

      requester:
        type: HttpRequester
        url_base: "https://newsapi.org"
        path: "/v2/top-headlines"
        authenticator:
          type: ApiKeyAuthenticator
          header: "X-Api-Key"
          api_token: "{{ config['api_key'] }}"

      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["articles"]   # same envelope: { status, totalResults, articles: [...] }

      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: "pageSize"     # docs: "number of results per page; default 20, max 100"
        page_token_option:
          type: RequestOption
          field_name: "page"         # docs: "use this to page through the results"
        pagination_strategy:
          type: PageIncrement
          page_size: 100             # docs max is 100

    # No incremental_sync: /v2/top-headlines has no from/to date-filter parameters (see open questions)

    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          source:
            type: ["null", "object"]
            properties:
              id:   { type: ["null", "string"] }
              name: { type: ["null", "string"] }
          author:      { type: ["null", "string"] }
          title:       { type: ["null", "string"] }
          description: { type: ["null", "string"] }
          url:         { type: ["null", "string"] }
          urlToImage:  { type: ["null", "string"] }
          publishedAt: { type: string, format: date-time }
          content:     { type: ["null", "string"] }
