# A declarative source in Airbyte's low-code format, moved from weir (CLOACINA-T-0992).
# Authored solely from OpenAQ's official API documentation
# (https://docs.openaq.org/); no third-party connector implementation was consulted.
# License: Apache-2.0 (this repo).
type: DeclarativeSource

streams:

  # ── 1. LOCATIONS ──────────────────────────────────────────────────────────
  - type: DeclarativeStream
    name: locations
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "https://api.openaq.org"
        path: "/v3/locations"
        authenticator:
          type: ApiKeyAuthenticator
          header: "X-API-Key"
          api_token: "{{ config['api_key'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["results"]
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: "limit"
        page_token_option:
          type: RequestOption
          field_name: "page"
        pagination_strategy:
          type: PageIncrement
          page_size: 100
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          id:          { type: integer }
          name:        { type: ["null", "string"] }
          locality:    { type: ["null", "string"] }
          timezone:    { type: ["null", "string"] }
          isMobile:    { type: ["null", "boolean"] }
          isMonitor:   { type: ["null", "boolean"] }
          distance:    { type: ["null", "number"] }
          bounds:      { type: ["null", "array"] }
          country:
            type: ["null", "object"]
            properties:
              id:   { type: integer }
              code: { type: ["null", "string"] }
              name: { type: ["null", "string"] }
          owner:
            type: ["null", "object"]
            properties:
              id:   { type: integer }
              name: { type: ["null", "string"] }
          provider:
            type: ["null", "object"]
            properties:
              id:   { type: integer }
              name: { type: ["null", "string"] }
          coordinates:
            type: ["null", "object"]
            properties:
              latitude:  { type: ["null", "number"] }
              longitude: { type: ["null", "number"] }
          datetimeFirst:
            type: ["null", "object"]
            properties:
              utc:   { type: ["null", "string"], format: date-time }
              local: { type: ["null", "string"] }
          datetimeLast:
            type: ["null", "object"]
            properties:
              utc:   { type: ["null", "string"], format: date-time }
              local: { type: ["null", "string"] }
          instruments: { type: ["null", "array"] }
          sensors:     { type: ["null", "array"] }
          licenses:    { type: ["null", "array"] }

  # ── 2. MEASUREMENTS ───────────────────────────────────────────────────────
  # NOTE: This stream requires `sensors_id` as a path parameter
  # (a parent-child / substream dependency on the sensors/locations
  # hierarchy). The target schema cannot express parameterised paths
  # from a parent stream. See Open questions #1 and #2 below.
  - type: DeclarativeStream
    name: measurements
    # no primary_key: measurements have no id field in the API response
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "https://api.openaq.org"
        # INCOMPLETE PATH — sensors_id must come from a parent stream;
        # the target schema cannot supply it. See Open questions #1.
        path: "/v3/sensors/{{ config['sensors_id'] }}/measurements"
        authenticator:
          type: ApiKeyAuthenticator
          header: "X-API-Key"
          api_token: "{{ config['api_key'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["results"]
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: "limit"
        page_token_option:
          type: RequestOption
          field_name: "page"
        pagination_strategy:
          type: PageIncrement
          page_size: 100
    incremental_sync:
      # PARTIAL — the cursor field is nested (period.datetimeFrom.utc),
      # not a top-level field. See Open questions #2.
      type: DatetimeBasedCursor
      cursor_field: "period"          # top-level field only; nesting unsupported here
      start_time_option:
        type: RequestOption
        field_name: "datetime_from"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          value:
            type: ["null", "number"]
          flagInfo:
            type: ["null", "object"]
            properties:
              hasFlags: { type: boolean }
          parameter:
            type: ["null", "object"]
            properties:
              id:          { type: integer }
              name:        { type: ["null", "string"] }
              units:       { type: ["null", "string"] }
              displayName: { type: ["null", "string"] }
          period:
            type: ["null", "object"]
            properties:
              label:    { type: ["null", "string"] }
              interval: { type: ["null", "string"] }
              datetimeFrom:
                type: ["null", "object"]
                properties:
                  utc:   { type: ["null", "string"], format: date-time }
                  local: { type: ["null", "string"] }
              datetimeTo:
                type: ["null", "object"]
                properties:
                  utc:   { type: ["null", "string"], format: date-time }
                  local: { type: ["null", "string"] }
          coordinates:
            type: ["null", "object"]
            properties:
              latitude:  { type: ["null", "number"] }
              longitude: { type: ["null", "number"] }
          summary:
            type: ["null", "object"]
            properties:
              min:    { type: ["null", "number"] }
              q02:    { type: ["null", "number"] }
              q25:    { type: ["null", "number"] }
              median: { type: ["null", "number"] }
              q75:    { type: ["null", "number"] }
              q98:    { type: ["null", "number"] }
              max:    { type: ["null", "number"] }
              avg:    { type: ["null", "number"] }
              sd:     { type: ["null", "number"] }
          coverage:
            type: ["null", "object"]
            properties:
              expectedCount:    { type: ["null", "integer"] }
              observedCount:    { type: ["null", "integer"] }
              percentComplete:  { type: ["null", "number"] }
