# A declarative source in Airbyte's low-code format, moved from weir (CLOACINA-T-0992).
# Authored solely from PagerDuty REST API's official API documentation
# (https://developer.pagerduty.com/api-reference/); no third-party connector implementation was consulted.
# License: Apache-2.0 (this repo).
type: DeclarativeSource

streams:
  # ───────────────────────────────────────────────
  # Stream 1: incidents
  # ───────────────────────────────────────────────
  - type: DeclarativeStream
    name: incidents
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "https://api.pagerduty.com"
        path: "/incidents"
        authenticator:
          type: ApiKeyAuthenticator
          header: "Authorization"
          api_token: "Token token={{ config['api_key'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["incidents"]
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: "limit"
        page_token_option:
          type: RequestOption
          field_name: "offset"
        pagination_strategy:
          type: OffsetIncrement
          page_size: 100
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      start_time_option:
        type: RequestOption
        field_name: "since"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          id:
            type: string
          summary:
            type: ["null", "string"]
          type:
            type: string
          self:
            type: ["null", "string"]
          html_url:
            type: ["null", "string"]
          incident_number:
            type: integer
          title:
            type: string
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
          status:
            type: string
          incident_key:
            type: string
          assigned_via:
            type: string
          last_status_change_at:
            type: string
            format: date-time
          resolved_at:
            type: ["null", "string"]
            format: date-time
          is_mergeable:
            type: boolean
          urgency:
            type: string
          service:
            type: object
          assignments:
            type: array
          first_trigger_log_entry:
            type: object
          alert_counts:
            type: object
          incident_type:
            type: object
          escalation_policy:
            type: object
          teams:
            type: array
          pending_actions:
            type: array
          acknowledgements:
            type: array
          alert_grouping:
            type: object
          last_status_change_by:
            type: object
          priority:
            type: object
          resolve_reason:
            type: object
          conference_bridge:
            type: object
          incidents_responders:
            type: array
          responder_requests:
            type: array
          body:
            type: object

  # ───────────────────────────────────────────────
  # Stream 2: services
  # ───────────────────────────────────────────────
  - type: DeclarativeStream
    name: services
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "https://api.pagerduty.com"
        path: "/services"
        authenticator:
          type: ApiKeyAuthenticator
          header: "Authorization"
          api_token: "Token token={{ config['api_key'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["services"]
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: "limit"
        page_token_option:
          type: RequestOption
          field_name: "offset"
        pagination_strategy:
          type: OffsetIncrement
          page_size: 100
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          id:
            type: string
          summary:
            type: ["null", "string"]
          type:
            type: string
          self:
            type: ["null", "string"]
          html_url:
            type: ["null", "string"]
          name:
            type: string
          description:
            type: string
          auto_resolve_timeout:
            type: ["null", "integer"]
          acknowledgement_timeout:
            type: ["null", "integer"]
          created_at:
            type: string
            format: date-time
          status:
            type: string
          last_incident_timestamp:
            type: ["null", "string"]
            format: date-time
          alert_creation:
            type: string
          alert_grouping:
            type: ["null", "string"]
          alert_grouping_timeout:
            type: ["null", "integer"]
          escalation_policy:
            type: object
          teams:
            type: array
          integrations:
            type: array
          incident_urgency_rule:
            type: object
          support_hours:
            type: object
          scheduled_actions:
            type: array
          addons:
            type: array
          alert_grouping_parameters:
            type: object
          auto_pause_notifications_parameters:
            type: object
