[package]
name = "cloacina-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural macros for the cloacina workflow orchestration library."
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
# The pool name rule and the quantity grammar of `#[task(pool, cpu, memory)]`
# (CLOACINA-T-1027): the same rules the server's pool routes use.
cloacina-api-types = { workspace = true }
once_cell.workspace = true
proc-macro2 = { version = "1.0" }
quote = { version = "1.0" }
serde_json.workspace = true
syn = { version = "3", features = ["full"] }
thiserror = { version = "2" }
