[package]
name = "cloacina-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Build service for Cloacina packages — compiles source into cdylib artifacts and persists them in the DB for runtime instances to load."
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true

[lib]
name = "cloacina_compiler"
path = "src/lib.rs"

[[bin]]
name = "cloacina-compiler"
path = "src/main.rs"

[features]
default = ["postgres"]
postgres = ["cloacina/postgres"]
sqlite = ["cloacina/sqlite"]

[dependencies]
cloacina-workflow-plugin = { workspace = true }
# `constructor-packaging` (serde-only, no wasmtime): the build step discovers a
# package's `constructor!` provider refs and bundles each provider into
# `package_providers` (CLOACI-T-0836).
#
# `constructors-wasm` (CLOACINA-T-1074): the describe child imports a Python
# package the way a server does, and `cloaca.constructor(...)` resolves a
# bundled provider during that import.
cloacina = { workspace = true, default-features = false, features = ["constructor-packaging", "constructors-wasm"] }
# CLOACINA-T-1074: the describe child (this binary, started again in describe
# mode) imports a Python package to read its tasks, triggers, reactors and
# graph. `default-features = false` (not `extension-module`) embeds the
# interpreter, as in the server and the agent, so the compiler host needs
# libpython.
cloacina-python = { workspace = true, default-features = false }
cloacina-api-types = { workspace = true }
clap.workspace = true
anyhow.workspace = true
serde_json = "1.0"
toml = "1"
# CLOACI-T-0752: parse Rust doc-comments out of package source at build time.
syn = { version = "3", features = ["full"] }
proc-macro2 = "1.0"
axum = { version = "0.8" }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
fidius-core = { workspace = true }
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
tracing = { version = "0.1" }
tracing-appender = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[build-dependencies]
# Link settings for the embedded Python interpreter (the describe child).
cloacina-build = { workspace = true }

[dev-dependencies]
serial_test = "4"
serde = "1.0"
async-trait = "0.1"
