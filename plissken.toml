[project]
name = "cloacina"
version_from = "cargo"

[output]
format = "markdown"
path = "docs/src/content/docs/reference/api"
template = "starlight"

# crates/cloacina-python is listed so that plissken finds the PyO3 bindings:
# it follows their #[pymodule] and writes the Python API as one page,
# reference/api/cloaca/, next to their Rust pages.
[rust]
crates = [
    "crates/cloacina",
    "crates/cloacina-computation-graph",
    "crates/cloacina-workflow",
    "crates/cloacina-python",
]

# Python (cloaca) API pages are generated from the PyO3 binding source.
# The bindings moved out of crates/cloacina into the dedicated
# crates/cloacina-python crate (T-0529); keep this path pointed there.
# Regenerate the whole reference/api tree with `plissken render` (0.2.0) from
# the project root and commit the output. plissken deletes the pages of
# modules that went away; add a redirect for each (docs/src/redirects.json).
[python]
package = "cloaca"
source = "crates/cloacina-python/src"
