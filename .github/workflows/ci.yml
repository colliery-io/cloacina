---
name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '.metis/**'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - 'CHANGELOG.md'
      - '.vscode/**'
      - '.idea/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '.metis/**'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - 'CHANGELOG.md'
      - '.vscode/**'
      - '.idea/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what changed to conditionally run jobs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      workflows: ${{ steps.filter.outputs.workflows }}
      harness: ${{ steps.filter.outputs.harness }}
      examples: ${{ steps.filter.outputs.examples }}
      charts: ${{ steps.filter.outputs.charts }}
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      scripts: ${{ steps.filter.outputs.scripts }}
      compiler: ${{ steps.filter.outputs.compiler }}
      crates: ${{ steps.crates.outputs.crates }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/cloacina/**'
              - 'crates/cloacina-build/**'
              - 'crates/cloacina-computation-graph/**'
              - 'crates/cloacinactl/**'
              - 'crates/cloacina-macros/**'
              - 'crates/cloacina-testing/**'
              - 'crates/cloacina-workflow/**'
              - 'crates/cloacina-workflow-plugin/**'
              # CLOACI-T-0917: these crates + the python surfaces were absent —
              # a PR touching only them ran ZERO test lanes. Server lib/auth
              # tests run in the integration lane (cloacina.yml), and the
              # python bindings/scenarios/client are exercised by
              # `angreal test integration`, so all of these must reach the
              # reusable test matrix.
              - 'crates/cloacina-agent/**'
              - 'crates/cloacina-client/**'
              - 'crates/cloacina-compiler/**'
              - 'crates/cloacina-constructor-contract/**'
              - 'crates/cloacina-python/**'
              - 'crates/cloacina-server/**'
              - 'tests/python/**'
              - 'clients/python/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            harness:
              - '.angreal/**'
            examples:
              - 'examples/**'
            charts:
              - 'charts/**'
              # Dockerfile is the basis for the helm e2e image — touch it,
              # rebuild + re-run the kind install.
              - 'Dockerfile'
              - '.dockerignore'
            # Public API contract surface (CLOACI-T-0643): anything that can
            # change the OpenAPI document, the committed document itself, or
            # the generated SDK code derived from it (T-0645).
            api:
              - 'crates/cloacina-server/**'
              - 'crates/cloacina-api-types/**'
              - 'docs/public/openapi.json'
              - 'clients/typescript/**'
              - 'Cargo.*'
            # UI ship-readiness gate (CLOACI-I-0117 / T-0661): the SPA, the
            # SDK it consumes, or the spec the types derive from.
            ui:
              - 'ui/**'
              - 'clients/typescript/**'
              - 'docs/public/openapi.json'
            # CLOACI-T-0917: CI guard scripts (credential-logging, version
            # lockstep, publish tiers) must at minimum re-run quick-checks
            # when they change.
            scripts:
              - 'scripts/**'
            # CLOACINA-T-1131: the compiler, the packaging code and the
            # plugin interface; the compiler's tests run when one changes.
            compiler:
              - 'crates/cloacina-compiler/**'
              - 'crates/cloacina/src/packaging/**'
              - 'crates/cloacina/src/registry/**'
              - 'crates/cloacina-workflow-plugin/**'
              - 'crates/cloacina-python/**'
              - 'crates/cloacina-build/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
            # CLOACINA-T-1131: one filter per crate of the `crate-tests`
            # matrix: the crate and the workspace crates it depends on. The
            # name is `crate-<crate>`; the step below makes the matrix of them.
            crate-cloacina-agent:
              - 'crates/cloacina-agent/**'
              - 'crates/cloacina/**'
              - 'crates/cloacina-python/**'
              - 'crates/cloacina-build/**'
              - 'crates/cloacina-workflow/**'
              - 'crates/cloacina-workflow-plugin/**'
              - 'crates/cloacina-computation-graph/**'
              - 'crates/cloacina-macros/**'
              - 'crates/cloacina-api-types/**'
              - 'crates/cloacina-constructor-contract/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
            crate-cloacina-macros:
              - 'crates/cloacina-macros/**'
              - 'crates/cloacina-api-types/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
            crate-cloacina-workflow-plugin:
              - 'crates/cloacina-workflow-plugin/**'
              - 'crates/cloacina-workflow/**'
              - 'crates/cloacina-computation-graph/**'
              - 'crates/cloacina-macros/**'
              - 'crates/cloacina-api-types/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
            crate-cloacina-api-types:
              - 'crates/cloacina-api-types/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
            crate-cloacina-testing:
              - 'crates/cloacina-testing/**'
              - 'crates/cloacina-workflow/**'
              - 'crates/cloacina-macros/**'
              - 'crates/cloacina-api-types/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
            crate-cloacina-constructor-contract:
              - 'crates/cloacina-constructor-contract/**'
              - 'crates/cloacina-api-types/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
            crate-cloacina-python:
              - 'crates/cloacina-python/**'
              - 'crates/cloacina/**'
              - 'crates/cloacina-build/**'
              - 'crates/cloacina-workflow/**'
              - 'crates/cloacina-workflow-plugin/**'
              - 'crates/cloacina-computation-graph/**'
              - 'crates/cloacina-macros/**'
              - 'crates/cloacina-api-types/**'
              - 'crates/cloacina-constructor-contract/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
            crate-cloacina-client:
              - 'crates/cloacina-client/**'
              - 'crates/cloacina-api-types/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'

      # The crates of the `crate-tests` matrix: every one on a push, or when a
      # workflow changes; else the ones whose filter matched.
      - name: Crates whose tests run
        id: crates
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          RUN_ALL: ${{ github.event_name == 'push' || steps.filter.outputs.workflows == 'true' }}
        run: |
          set -euo pipefail
          if [ "$RUN_ALL" = "true" ]; then
            crates=$(jq -cn '$ARGS.positional' --args \
              cloacina-agent cloacina-macros cloacina-workflow-plugin \
              cloacina-api-types cloacina-testing cloacina-constructor-contract \
              cloacina-python cloacina-client)
          else
            crates=$(jq -c '[.[] | select(startswith("crate-")) | ltrimstr("crate-")]' <<<"$CHANGED")
          fi
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          echo "crates: $crates"

  # Quick gate - only runs if code, the API surface, harness, scripts, or workflows changed
  quick-checks:
    name: Quick Checks
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.workflows == 'true' ||
      needs.changes.outputs.harness == 'true' ||
      needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      # Swatinem/rust-cache, like the test lanes: keyed on the lockfile and
      # toolchain, pruned of workspace artifacts on save. The raw
      # actions/cache it replaces hashed every Cargo.toml in the tree, so any
      # example manifest edit missed the exact key and clippy went cold.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cloacina-quick-checks"

      - name: Credential-logging guard (OPS-03 / T-0443)
        run: python3 scripts/check_credential_logging.py

      # CLOACI-T-0917: version lockstep was pre-commit-only (one --no-verify
      # from drift reaching main). Stdlib-only script, no build needed.
      - name: Version lockstep (single source of truth)
        run: python3 .angreal/version_lockstep.py check

      # CLOACI-T-0917: the hand-maintained crates.io publish tiers in
      # unified_release.yml must cover every publishable workspace crate
      # exactly once (0.10.0 postmortem 8961abb5 — two crates missing).
      - name: Publish-tier completeness (unified_release.yml)
        run: python3 scripts/check_publish_tiers.py

      # CLOACINA-T-1018: the static half of the SDK coverage rule ran only in
      # the nightly sdk-contract job, so two routes merged with no hand-written
      # SDK method and main went red at night. Stdlib-only scripts, no build
      # and no server. The job also runs on `api` changes (the spec, the
      # api types, the TypeScript client) because the rule reads them.
      - name: SDK coverage rule and version lockstep
        run: |
          python3 scripts/check_sdk_coverage.py
          python3 scripts/check_sdk_versions.py

      # CLOACINA-T-1087: a migration leaves the previous minor's server
      # working (no drop, rename, NOT NULL without default or unique index
      # without a `-- compat:` line). Stdlib-only script.
      - name: Migration compat lint
        run: |
          python3 scripts/check_migration_compat.py --self-test
          python3 scripts/check_migration_compat.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      # clippy --all-targets is a superset of `cargo check` for the same
      # feature set (it type-checks everything check would, then lints), so
      # the separate check steps that used to follow compiled nothing new.
      - name: Clippy (SQLite)
        run: cargo clippy --features sqlite --all-targets

      - name: Clippy (PostgreSQL)
        run: cargo clippy --features postgres --all-targets

  # OpenAPI spec drift gate (CLOACI-T-0643 / NFR-001): the committed
  # docs/public/openapi.json must match a fresh `emit-openapi` from the
  # server. Fails when routes/DTOs change without regenerating the spec.
  spec-check:
    name: OpenAPI Spec Drift
    needs: changes
    if: |
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cloacina-spec-check"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install angreal
        uses: ./.github/actions/install-angreal

      - name: Spec drift check
        run: angreal docs spec-check

      # CLOACINA-T-1055: the route and role tables of the security model page
      # are generated from the server's authorization table.
      - name: Authorization table docs check
        run: angreal docs authz-table-check

      # Generated-SDK drift (T-0645 / NFR-001): the committed TS types must
      # match a fresh generation from the committed spec.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: TS generated-types drift check
        working-directory: clients/typescript
        run: |
          npm ci
          npm run check:generated
          npm run typecheck
          npm run build

      # Python generated-client drift. The TS client has had a drift gate since
      # T-0645; the Python client's generator version lived only in a README
      # sentence with nothing enforcing it, and the committed tree silently fell
      # behind the documented pin (~100 files, plus an undeclared
      # typing_extensions dependency). Same guard, both languages.
      - name: Install uv (pinned Python SDK generator)
        uses: astral-sh/setup-uv@v5

      - name: Python generated-client drift check
        run: python3 scripts/check_python_sdk_generated.py

  # UI ship-readiness gate (CLOACI-I-0117 / T-0661; reshaped by I-0141): the
  # cheap PR checks — version lockstep and the Leptos UI building for wasm
  # (trunk). The UI no longer consumes the TS SDK (it rides cloacina-client on
  # wasm), so the SDK build lives only in the sdk job. The full Playwright
  # acceptance lane (Docker + Rust + a real browser) runs nightly
  # (`angreal test ui-e2e`).
  ui-checks:
    name: UI Checks
    needs: changes
    if: |
      needs.changes.outputs.ui == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version lockstep (server + SDKs + UI)
        run: python3 scripts/check_sdk_versions.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk

      - name: Cache UI build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/target
          key: ${{ runner.os }}-ui-leptos-${{ hashFiles('ui/Cargo.lock') }}

      - name: UI check + trunk build
        working-directory: ui
        run: |
          cargo check --target wasm32-unknown-unknown
          trunk build --release

  # Rust + Python tests (Python is now native in cloacina core)
  cloacina-tests:
    name: Cloacina Tests
    needs: [quick-checks, changes]
    if: |
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.harness == 'true' ||
      needs.changes.outputs.workflows == 'true'
    uses: ./.github/workflows/cloacina.yml

  # CLOACINA-T-1131: the cloacina-compiler crate's own tests (lib, bin and
  # tests/describe.rs). They hold the compiler's security rules: the describe
  # child runs confined with no database URL, a tenant's library is never
  # opened in the compiler's process, children get a cleared environment and
  # limits, and the Python vendoring rules. Linux applies the resource limits
  # that macOS skips. On `main` (push) the job always runs.
  compiler-tests:
    name: Compiler Tests
    needs: changes
    if: |
      github.event_name == 'push' ||
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL dev libraries
        uses: ./.github/actions/apt-install
        with:
          packages: libpq-dev

      # The describe child embeds the interpreter: the build links libpython.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cloacina-compiler-tests"

      - name: cargo test -p cloacina-compiler
        run: cargo test -p cloacina-compiler --all-targets --features postgres,sqlite

  # CLOACINA-T-1131: the tests of the crates that no other lane runs, one leg
  # per crate, on Linux. cloacina-agent's worker processes, rlimits and
  # /proc memory reads are Linux-only code. The legs are the crates whose
  # filter in `changes` matched; on `main` (push) every crate. The Rust tests
  # of cloacina-python include runner tests against Postgres on port 15432,
  # so that leg starts a Postgres service. cloacina-client runs its unit tests
  # only: tests/contract.rs needs a live server and a key, and runs in the
  # nightly SDK contract job.
  crate-tests:
    name: Crate Tests (${{ matrix.crate }})
    needs: changes
    if: needs.changes.outputs.crates != '' && needs.changes.outputs.crates != '[]'
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.crates) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        # An empty image starts no service: only the cloacina-python leg
        # gets Postgres.
        image: ${{ matrix.crate == 'cloacina-python' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: cloacina
          POSTGRES_PASSWORD: cloacina
          POSTGRES_DB: cloacina
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U cloacina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The agent and the Python bindings link cloacina with wasmtime and an
      # embedded interpreter: large debug builds.
      - uses: ./.github/actions/free-disk-space
        if: matrix.crate == 'cloacina-agent' || matrix.crate == 'cloacina-python'

      - name: Install PostgreSQL dev libraries
        uses: ./.github/actions/apt-install
        with:
          packages: libpq-dev

      # The agent and cloacina-python embed the interpreter: the build links
      # libpython.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cloacina-crate-tests-${{ matrix.crate }}"

      - name: cargo test -p ${{ matrix.crate }}
        env:
          CRATE: ${{ matrix.crate }}
        run: |
          set -euo pipefail
          case "$CRATE" in
            cloacina-client) targets="--lib" ;;
            *) targets="--all-targets" ;;
          esac
          cargo test -p "$CRATE" $targets

  # Tutorial / feature demo matrix — verifies the `angreal demos …` surface
  examples-docs:
    name: Examples & Docs
    needs: [quick-checks, changes]
    if: |
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.harness == 'true' ||
      needs.changes.outputs.workflows == 'true' ||
      needs.changes.outputs.examples == 'true'
    uses: ./.github/workflows/examples-docs.yml

  # Helm chart lint + template (CLOACI-I-0111 / T-0605)
  helm-chart:
    name: Helm chart lint
    needs: changes
    if: |
      needs.changes.outputs.charts == 'true' ||
      needs.changes.outputs.harness == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: helm dependency update
        # Vendors Bitnami postgresql subchart (conditional dep). Required
        # before `helm template` even when the dep's condition is false —
        # helm validates dep presence regardless of condition resolution.
        run: helm dependency update charts/cloacina-server

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install angreal
        uses: ./.github/actions/install-angreal

      # The same task a person runs (CLOACINA-T-1044): helm lint and every
      # helm template variant of both charts live in .angreal/task_helm.py.
      - name: helm lint + template variants
        run: angreal helm lint

  # End-to-end Helm chart install on a kind cluster (CLOACI-I-0111 / T-0605).
  # Builds the cloacina-server image, loads it into kind, helm-installs the
  # chart with bundled Postgres, and verifies /health returns 200.
  helm-chart-e2e:
    name: Helm chart e2e (kind)
    needs: [helm-chart, changes]
    if: |
      needs.changes.outputs.charts == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cloacina-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: cloacina-server:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cloacina-helm-e2e
          wait: 120s

      - name: Load image into kind
        run: kind load docker-image cloacina-server:e2e --name cloacina-helm-e2e

      - name: helm dependency update
        run: helm dependency update charts/cloacina-server

      - name: helm install (bundled postgres)
        run: |
          set -euo pipefail
          PASSWORD=$(openssl rand -hex 16)
          # CLOACI-T-0610 — the embedded subchart pulls official
          # docker.io/library/postgres:17, which never needs the
          # bitnamilegacy override the prior Bitnami subchart did.
          helm install cloacina charts/cloacina-server \
            --namespace cloacina-e2e --create-namespace \
            --set image.repository=cloacina-server \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set postgresql.enabled=true \
            --set postgresql.auth.password="${PASSWORD}" \
            --set fleet.actuator=kubernetes \
            --set-string 'server.networkPolicy.from[0].podSelector.matchLabels.cloacina-e2e-client=true' \
            --wait --timeout=8m

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cloacina-cloacina-server \
            -n cloacina-e2e --timeout=5m

      # CLOACINA-T-1030: the install above turns the Kubernetes fleet actuator
      # on, so the server builds its in-cluster kube client (TLS) at start. A
      # server that cannot build it panics and never becomes ready. No tenant
      # is made, so no agent image is pulled.
      - name: The fleet actuator started
        run: |
          set -euo pipefail
          kubectl logs deployment/cloacina-cloacina-server -n cloacina-e2e \
            | tee /tmp/server.log | grep "fleet actuator initialized" | grep kubernetes
          if grep -q "panicked" /tmp/server.log; then
            echo "the server log has a panic" >&2
            exit 1
          fi

      - name: Curl /health from inside the cluster
        run: |
          set -euo pipefail
          # The pod runs detached and its log is read after it ends: with
          # `kubectl run -i --rm`, a command that ends at once can finish
          # before kubectl attaches, and its output is lost.
          # CLOACINA-T-1069: the install lists this label in
          # server.networkPolicy.from; other pods cannot reach the API port.
          kubectl run healthcheck \
            -n cloacina-e2e \
            --labels=cloacina-e2e-client=true \
            --restart=Never \
            --image=curlimages/curl:8.10.1 \
            --command -- curl -sS --retry 5 --retry-connrefused --max-time 10 \
            -o /dev/null -w "HTTP %{http_code}\n" \
            http://cloacina-cloacina-server:8080/health
          kubectl wait pod/healthcheck -n cloacina-e2e \
            --for=jsonpath='{.status.phase}'=Succeeded --timeout=120s \
            || kubectl describe pod/healthcheck -n cloacina-e2e
          kubectl logs pod/healthcheck -n cloacina-e2e | tee /tmp/health.out
          grep -q "HTTP 200" /tmp/health.out

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== pods ==="
          kubectl get pods -n cloacina-e2e
          echo "=== events ==="
          kubectl get events -n cloacina-e2e --sort-by=.lastTimestamp
          echo "=== server logs ==="
