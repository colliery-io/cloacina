---
# CLOACI-T-0872 — the provider release WAVE.
#
# Providers version independently of core (ADR A-0010) and release in waves:
# one trigger covers every provider in providers/. Per provider:
#   classify (bumped vs crates.io?) → guard (changelog/ship-form/publishable)
#   → certify (the certify/ harness: core from CRATES.IO, provider E2E)
#   → publish (candidates only) → record (COMPAT.toml PR) → wave notes.
# Waves are PER-PROVIDER ATOMIC: a failing candidate drops out with a report;
# an UNCHANGED provider failing re-certification is the contract-drift alarm.
# Deliberately separate from unified_release.yml (core's train) — I-0134
# non-goal: never entangle core's release with providers.
name: "Provider Release Wave"

on:
  push:
    tags:
      - 'providers-v*'
  workflow_dispatch:
    inputs:
      wave_id:
        description: "Wave id (e.g. 2026.08); defaults to the tag name on tag pushes"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: provider-wave
  cancel-in-progress: false

jobs:
  certify-fs:
    name: "Certify + publish: cloacina-provider-fs"
    runs-on: ubuntu-latest
    outputs:
      certified: ${{ steps.verdict.outputs.certified }}
      published: ${{ steps.verdict.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Classify
        id: classify
        run: |
          python3 scripts/provider_wave.py classify
          CAND=$(python3 scripts/provider_wave.py classify --json | python3 -c "import json,sys; rows=json.load(sys.stdin); print([r['candidate'] for r in rows if r['dir']=='cloacina-provider-fs'][0])")
          echo "candidate=${CAND}" >> "$GITHUB_OUTPUT"

      - name: Guard (candidates only)
        if: steps.classify.outputs.candidate == 'True'
        run: python3 scripts/provider_wave.py guard cloacina-provider-fs

      - name: Certify — E2E against crates.io core
        run: |
          cd providers/cloacina-provider-fs/certify
          cargo run --release

      - name: Publish (candidates only)
        if: steps.classify.outputs.candidate == 'True'
        run: |
          cd providers/cloacina-provider-fs
          # PIPESTATUS, not the pipeline status — tee's 0 masked a real 400
          # failure in the inaugural wave (the exact trap the core train's
          # publish helper documents).
          cargo publish 2>&1 | tee /tmp/publish.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -qE "already (exists|uploaded)" /tmp/publish.log \
              && echo "already published" || exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Verdict
        id: verdict
        run: |
          echo "certified=true" >> "$GITHUB_OUTPUT"
          echo "published=${{ steps.classify.outputs.candidate }}" >> "$GITHUB_OUTPUT"

  certify-kafka:
    name: "Certify + publish: cloacina-provider-kafka"
    runs-on: ubuntu-latest
    outputs:
      certified: ${{ steps.verdict.outputs.certified }}
      published: ${{ steps.verdict.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libpq + sasl
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libsasl2-dev

      # The certify harness produces via `docker exec cloacina-kafka` (core
      # carries no kafka client, T-0898) — run the broker as a named
      # container, matching the dev stack, not a `services:` block.
      - name: Start Kafka broker
        run: |
          docker run -d --name cloacina-kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=true \
            apache/kafka:3.9.0
          for i in $(seq 1 30); do
            docker exec cloacina-kafka /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Classify
        id: classify
        run: |
          CAND=$(python3 scripts/provider_wave.py classify --json | python3 -c "import json,sys; rows=json.load(sys.stdin); print([r['candidate'] for r in rows if r['dir']=='cloacina-provider-kafka'][0])")
          echo "candidate=${CAND}" >> "$GITHUB_OUTPUT"

      - name: Guard (candidates only)
        if: steps.classify.outputs.candidate == 'True'
        run: python3 scripts/provider_wave.py guard cloacina-provider-kafka

      - name: Certify — E2E against crates.io core (native + real broker)
        run: |
          cd providers/cloacina-provider-kafka/certify
          cargo run --release
        env:
          CLOACINA_KAFKA_BROKER: localhost:9092
          CLOACINA_KAFKA_CONTAINER: cloacina-kafka

      - name: Publish (candidates only)
        if: steps.classify.outputs.candidate == 'True'
        run: |
          cd providers/cloacina-provider-kafka
          # PIPESTATUS, not the pipeline status — tee's 0 masked a real 400
          # failure in the inaugural wave (the exact trap the core train's
          # publish helper documents).
          cargo publish 2>&1 | tee /tmp/publish.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -qE "already (exists|uploaded)" /tmp/publish.log \
              && echo "already published" || exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Verdict
        id: verdict
        run: |
          echo "certified=true" >> "$GITHUB_OUTPUT"
          echo "published=${{ steps.classify.outputs.candidate }}" >> "$GITHUB_OUTPUT"

  record:
    name: "Record wave (COMPAT.toml PR + release notes)"
    needs: [certify-fs, certify-kafka]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute wave id
        id: wave
        env:
          TAG_REF: ${{ github.ref }}
          INPUT_ID: ${{ inputs.wave_id }}
        run: |
          if [[ "$TAG_REF" == refs/tags/providers-v* ]]; then
            echo "id=${TAG_REF#refs/tags/providers-v}" >> "$GITHUB_OUTPUT"
          else
            echo "id=${INPUT_ID:-manual-$(date -u +%Y.%m.%d)}" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate COMPAT.toml (certified providers only)
        run: |
          CERTIFIED=""
          [ "${{ needs.certify-fs.outputs.certified }}" = "true" ] && CERTIFIED="$CERTIFIED cloacina-provider-fs"
          [ "${{ needs.certify-kafka.outputs.certified }}" = "true" ] && CERTIFIED="$CERTIFIED cloacina-provider-kafka"
          python3 scripts/provider_wave.py compat --wave "${{ steps.wave.outputs.id }}" --certified $CERTIFIED

      - name: Open compat PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet providers/COMPAT.toml; then
            echo "COMPAT.toml unchanged"; exit 0
          fi
          BR="wave/${{ steps.wave.outputs.id }}-compat"
          git config user.name "provider-wave[bot]"
          git config user.email "provider-wave@users.noreply.github.com"
          git checkout -b "$BR"
          git add providers/COMPAT.toml
          git commit -m "docs(providers): compat table for wave ${{ steps.wave.outputs.id }}"
          git push -u origin "$BR" --force
          gh pr create --base main --title "docs(providers): compat table for wave ${{ steps.wave.outputs.id }}" \
            --body "Machine-generated by the provider wave. Certified: fs=${{ needs.certify-fs.outputs.certified }}, kafka=${{ needs.certify-kafka.outputs.certified }}; published: fs=${{ needs.certify-fs.outputs.published }}, kafka=${{ needs.certify-kafka.outputs.published }}." \
            || echo "PR may already exist"

      - name: Wave release notes (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/providers-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "Provider wave ${{ steps.wave.outputs.id }}" \
            --notes "Certified: fs=${{ needs.certify-fs.outputs.certified }}, kafka=${{ needs.certify-kafka.outputs.certified }}. Published: fs=${{ needs.certify-fs.outputs.published }}, kafka=${{ needs.certify-kafka.outputs.published }}. Tested set: providers/COMPAT.toml (see the wave compat PR)." \
            || echo "release may already exist"
