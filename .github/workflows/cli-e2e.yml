---
name: CLI E2E

# End-to-end test of `cloacinactl` against a live server: Postgres and
# cloacina-server with --single-trust, driven only through the CLI
# (`angreal test e2e cli`, CLOACINA-T-1142).
#
# The lane ran in no workflow, so a check went stale without notice. It runs
# on each pull request that touches the CLI or the routes it calls, on
# demand, and from the nightly suite, which is the release gate
# (unified_release.yml calls nightly.yml).

on:
  pull_request:
    paths:
      - 'crates/cloacinactl/**'
      - 'crates/cloacina-client/**'
      - 'crates/cloacina-api-types/**'
      - 'crates/cloacina-server/src/routes/**'
      - 'crates/cloacina-server/src/lib.rs'
      - '.angreal/test/e2e/cli.py'
      - '.angreal/docker-compose.yaml'
      - '.github/workflows/cli-e2e.yml'
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: cli-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  cli-e2e:
    name: CLI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install angreal
        uses: ./.github/actions/install-angreal

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cloacina-cli-e2e"

      - name: Install libpq
        uses: ./.github/actions/apt-install
        with:
          packages: libpq-dev

      # The task starts its own Postgres with docker compose.
      - name: CLI e2e (cloacinactl against a live server)
        run: angreal test e2e cli
