---
# The release gate (CLOACINA-T-1089): compares the pull request's head with
# the last v* tag (OpenAPI document, chart values and a render of the chart
# with the old values file, metrics catalog and code, version constants,
# migration folders, server flags) and asks for a CHANGELOG.md entry for each
# break. See docs/src/content/docs/contributing/release-gate.md.
#
# No paths-ignore: a pull request that only changes the changelog or the docs
# runs it too (ci.yml ignores docs/**, *.md and CHANGELOG.md).
name: Release gate

on:
  pull_request:
    branches:
      - main
      - 'burn-down-*'

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # "true": the gate reports its failures as warnings and the job passes.
  # Set to "false" once the Unreleased section of CHANGELOG.md holds every
  # break since the last release; the gate then fails the job.
  RELEASE_GATE_WARN_ONLY: "true"

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate reads the files of the last release tag.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: helm dependency update
        # The render of the head chart needs the postgresql subchart.
        run: helm dependency update charts/cloacina-server

      - name: Unit tests of the gate
        run: python -I scripts/tests/test_check_release_compat.py

      - name: Release gate
        run: |
          if [ "$RELEASE_GATE_WARN_ONLY" = "true" ]; then
            python -I scripts/check_release_compat.py --warn-only
          else
            python -I scripts/check_release_compat.py
          fi
